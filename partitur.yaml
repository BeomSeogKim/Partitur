score: "0.2"
name: authority-observability-json
revision: 1
status: finalized

goal: |
  Fix the run-loop-eligible half of issue #464 ("a1"), and nothing else. `partitur status --json`
  projects the run, application, journal, recovery, and budget position, but never the driver-owner
  identity that replay ALREADY holds in memory (`runstate.Authority`). So when a reboot kills the
  driver mid-movement, `status` renders the run as `RUNNING` / `Recovery: NOT_REQUIRED` with no field
  that lets a reader check, from the JSON alone, which process was recorded as the owner.

  THIS RUN'S FIX (code-only, decided in the design round — see context): add an always-present,
  additive `authority` object to `status --json`, projected purely from `runstate.Authority`:

      "authority": {
        "epoch": 1,                         // 0 == authority was never granted
        "owner": null | {                   // null WITH epoch > 0 == fenced/cleared or terminal-historical
          "pid": 89528,
          "start_identity": {"platform": "darwin", "start_tvsec": 1789292195, "start_tvusec": 717953}
        }
      }

  It is a sibling of `journal` / `recovery` / `budget` (append it LAST on `status.Report`, exactly as
  #456 appended `budget`), NOT a field inside `run`. It carries the RECORDED owner process identity as
  replayed from the `authority.granted` event. It performs NO liveness check: no `internal/procid`
  call, no process-table read, no clock sample. It is pure journal-projected replay data.

  SEMANTICS (verify against internal/runstate/types.go + internal/runstate/apply.go before coding):
    - epoch 0 + owner null  => authority was never granted.
    - epoch > 0 + owner null => authority was granted then FENCED/CLEARED (the two fencing paths reset
      `Authority{Epoch: e}`, retaining epoch and dropping owner: cancellation fence
      internal/runstate/apply.go ~:180-182, amendment/prepare fence ~:898), OR the run is TERMINAL
      (see next rule).
    - epoch > 0 + owner present => the recorded owner process identity of a NON-TERMINAL run.
    - TERMINAL run (lifecycle SUCCEEDED / FAILED / CANCELLED) => owner MUST be null. `Authority.Owner`
      is NEVER cleared at run.succeeded/run.failed (verified: the only `Authority{Epoch: …}` resets
      are the two fencing paths), so a terminal run keeps its last owner forever. Painting it would
      grow a permanent owner badge on every SUCCEEDED run in the repo. Gate the owner on
      `!terminal(string(state.Run))` using the EXISTING `terminal()` helper in internal/status/status.go.
      run.lifecycle stays the discriminator between fenced-nonterminal and terminal-historical.

  FORBIDDEN in this run, even if it would pass every test (these are the over-correction shapes #464
  invites — the spec-lane parts a2/b/c are OUT of scope and MUST be fenced out):
    - a2 (process-match tri-state): `internal/status` MUST NOT import `internal/procid`. No
      `procid.Matches`, no `Lease.MatchOwner`, no `recorded_owner_process_match` field, no liveness or
      "alive"/"gone" token anywhere. A grep fence proves this.
    - b (human-rendered line): do NOT add any new line to `renderStatusProjection`
      (cmd/partitur/main.go). The text surface stays byte-frozen — the `authority` object is
      `--json`-only, exactly as `budget` is today (rendered by neither surface). A lock test proves
      the dead-owner text output carries no authority/owner/pid substring.
    - c (skipped-unreadable-runs): NO `skipped_unreadable_runs` field, NO `observation` object, and NO
      change to the `ErrNoActiveRun` detail string anywhere. A grep fence proves this.
    - Any change to docs/DESIGN.md, docs/DESIGN.clause-staging.json, the clause-staging registry, or
      any other specification/ledger document. This is additive under existing anchors
      (status-json.v1-compatibility + status-json.complete-shape-is-not-closed-object), precedent
      be983ebc/#456, which changed ZERO spec bytes. docs/ stays byte-unchanged.
    - Any change to cmd/partitur/main.go, internal/runstate, internal/runstore, internal/procid,
      README.md, .github/, go.mod, go.sum, partitur.yaml, or .partitur/.
    - `recovery.state` must stay NOT_REQUIRED and `run.lifecycle` must stay RUNNING for the dead-owner
      fixture; exit codes 0/2/5 unchanged; `status --json` remains EXACTLY ONE JSON document;
      answer/approve/apply keep their fail-closed scan.

  No new production file. The only production edit is internal/status/status.go. Put the behavioral
  tests in a NEW file internal/status/authority_disclosure_test.go (package status), the end-to-end
  and text-freeze tests in a NEW file cmd/partitur/status_authority_disclosure_test.go, and extend the
  EXISTING internal/status/mutation_test.go with the three mutation cases. Do not rename any test.

context: |
  ROUTING (decided in the #464 design round, codex-reviewed): THIS SUB-ITEM (a1) IS RUN-LOOP ELIGIBLE
  AND CODE-ONLY. IT IS NOT A SPEC CHANGE. The full design is archived at
  partitur-handoff/archive-runs-2026-09/design-464-r1.md; this score implements only its
  "Score sketch for the run-loop half", minus the exit-2 stderr detail (that belongs to sub-item c,
  which the design routed to the spec lane; it is OUT of scope here).

  WHY CODE-ONLY (verified against the tree):
    - `status-json.v1-compatibility` (docs/DESIGN.md 3471-3473, "a compatible producer may add
      fields") and `status-json.complete-shape-is-not-closed-object` (3476-3477) license adding a
      field to `status --json` with no spec edit.
    - The `authority` object is a fact about THE SELECTED RUN's own journal (its `authority.granted`
      events), already replayed into `replay.State.Authority`. It is byte-identical IN KIND to the
      `budget` object added by be983ebc "#442(i) status budget disclosure": four Go files, zero
      docs/DESIGN.md change. `git show be983ebc -- docs/DESIGN.md` is empty. That commit is your
      structural template — read it: it added `Budget` to `status.Report`, a `budgetProjection(state)`
      helper called from `projectAt`, package tests in internal/status, an end-to-end test in
      cmd/partitur, and one mutation case in internal/status/mutation_test.go.
    - The spec-lane parts of #464 (a2 process-match probe, b human line, c skipped-runs) each need a
      normative source-confinement or text-surface amendment and are explicitly NOT in this run.

  THE DATA IS ALREADY IN MEMORY (verified):
    - `internal/runstate/types.go`: `Authority{Epoch uint64; Owner *AuthorityOwner}`;
      `AuthorityOwner{PID int; Start StartIdentity}`; `StartIdentity` is an INTERFACE with two concrete
      types — `DarwinStartIdentity{StartTVSec, StartTVUsec uint64}` (Platform()=="darwin") and
      `LinuxStartIdentity{BootID, StartTicks string}` (Platform()=="linux").
    - `projectAt` already receives `replay.State`, so `state.Authority` is in hand. `state.Run` is the
      `RunLifecycle`; the file's existing `terminal(lifecycle string) bool` helper covers
      SUCCEEDED/FAILED/CANCELLED.
    - Populated at internal/runstate/apply.go `case EventAuthorityGranted:` from payload
      `{authority_epoch, owner_pid, owner_start_identity}`.

  RECOMMENDED IMPLEMENTATION (internal/status/status.go). Adapt the exact gofmt spacing to the tree;
  the mutation anchors below must be copied VERBATIM from the gofmt'd source (count == 1 each):

    // Append to the Report struct AFTER `Budget Budget`, so the schema stays additive:
        Authority             Authority             `json:"authority"`

    // Types (place near Budget), with a comment stating this is journal-projected, no procid/liveness:
        type Authority struct {
            Epoch uint64          `json:"epoch"`
            Owner *AuthorityOwner `json:"owner"`
        }
        type AuthorityOwner struct {
            PID           int                     `json:"pid"`
            StartIdentity StartIdentityProjection `json:"start_identity"`
        }
        type StartIdentityProjection struct {
            Platform    string  `json:"platform"`
            StartTVSec  *uint64 `json:"start_tvsec,omitempty"`
            StartTVUsec *uint64 `json:"start_tvusec,omitempty"`
            BootID      *string `json:"boot_id,omitempty"`
            StartTicks  *string `json:"start_ticks,omitempty"`
        }

    // In the projectAt Report literal, beside `Budget: budgetProjection(state),`:
        Authority:             authorityProjection(state),

    // Helper — the three load-bearing conjuncts are marked:
        func authorityProjection(state runstate.State) Authority {
            projection := Authority{Epoch: state.Authority.Epoch}                 // CONJUNCT 2: epoch copy
            if state.Authority.Owner != nil && !terminal(string(state.Run)) {     // CONJUNCT 3: owner-nil / terminal branch
                owner := state.Authority.Owner
                projection.Owner = &AuthorityOwner{
                    PID:           owner.PID,
                    StartIdentity: startIdentityProjection(owner.Start),
                }
            }
            return projection
        }
    // CONJUNCT 1 is the assembly line `Authority: authorityProjection(state),` in projectAt.
    // startIdentityProjection type-switches on the StartIdentity interface: darwin ->
    // {platform:"darwin", start_tvsec, start_tvusec}; linux -> {platform:"linux", boot_id, start_ticks}.
    // The darwin JSON keys `platform`,`start_tvsec`,`start_tvusec` and `pid`,`epoch` are asserted by
    // the tests below by value — keep them exactly.

  FIXTURE REALITY (do NOT read any real run dir). The run named in #464
  (.partitur/runs/01a09a20-…) has since been resumed twice and is now SUCCEEDED / epoch 3, so it is
  unusable directly. SYNTHESIZE every fixture in-test, self-contained. The dead-owner condition is the
  literal seq-2 `authority.granted` payload the issue photographed:
      authority_epoch = 1
      owner_pid       = 89528
      owner_start_identity = {"platform":"darwin","start_tvsec":1789292195,"start_tvusec":717953}

  RECOMMENDED TESTS (all self-contained; the fenced/terminal/never-granted cases are cleanest as
  WHITE-BOX unit tests that call `authorityProjection(state)` directly with a hand-built
  `runstate.State`, exactly as internal/status/budget_disclosure_test.go is `package status`; the
  dead-owner and end-to-end cases go through a synthesized journal):

    internal/status/authority_disclosure_test.go (package status):
      - TestStatusDisclosesDeadOwnerAuthority: extend `statusFixture` (RunStarted, epoch 0) by
        appending a `runstate.EventAuthorityGranted` event with the literal seq-2 payload above (mirror
        the `appendBudgetEvent` helper from budget_disclosure_test.go). Call `Read`, marshal the
        report to JSON, assert it contains `"epoch":1`, `"pid":89528`, `"platform":"darwin"`,
        `"start_tvsec":1789292195`, `"start_tvusec":717953`. Red today (no authority field).
      - TestStatusAuthorityFencedVsNeverGrantedDistinguishable (white-box): assert
        `authorityProjection(runstate.State{Run: runstate.RunCancelled, Authority: runstate.Authority{Epoch: 2}})`
        marshals to `"epoch":2` with `"owner":null`, and
        `authorityProjection(runstate.State{Run: runstate.RunRunning, Authority: runstate.Authority{Epoch: 0}})`
        marshals to `"epoch":0` with `"owner":null`, and the two JSON documents DIFFER. Both owner
        null; the epoch alone distinguishes never-granted from fenced.
      - TestStatusTerminalRunDoesNotPaintOwner (white-box): build a `runstate.State` with
        `Run: runstate.RunFailed` and a non-nil `Authority.Owner` (epoch 1, pid 89528, the darwin
        identity), assert `authorityProjection` yields `"epoch":1` with `"owner":null` (NOT painted);
        as the contrast, the SAME owner with `Run: runstate.RunRunning` yields a non-null owner. This
        is the terminal-historical rule and the killing test for conjunct 3.
      - TestStatusDeadOwnerKeepsRecoveryAndLifecycle: on the dead-owner journal fixture, assert
        `report.Recovery.State == "NOT_REQUIRED"` and `report.Run.Lifecycle == "RUNNING"`
        (over-correction lock — must stay green).

    cmd/partitur/status_authority_disclosure_test.go (package main):
      - TestStatusJSONCarriesAuthorityObject: build a repo whose run has a synthesized
        RunStarted+AuthorityGranted journal (reuse the fixture helpers already in the cmd/partitur
        tests, e.g. resumeFixture / the store.Mutate pattern), run the real `status --json` path,
        assert exit 0, that stdout decodes as EXACTLY ONE JSON document (a second `Decoder.Decode`
        returns io.EOF), `schema == "partitur/status+json;v=1"`, and the decoded `authority` object
        carries epoch 1 + owner pid 89528 + the darwin start identity.
      - TestStatusTextRendererStaysByteFrozenForDeadOwner: render the dead-owner projection through the
        text surface (`renderStatusProjection` or the `status` text path) and assert the output
        contains NONE of the substrings `authority`, `Authority`, `owner`, `Owner`, ` pid`, `PID`
        (case check as written) — proving no human line was added (the b-is-spec-lane fence).

    internal/status/mutation_test.go (extend; //go:build mutation; package status). Add THREE
    functions, each calling `assertStatusMutationKilled(t, <killingTest>, environment, before, after,
    "internal/status/status.go", "internal/status", ".")`. Copy each `before` VERBATIM from the
    gofmt'd status.go (the helper fails if it does not occur exactly once):
      - TestMutationAuthorityAssemblyIsLoadBearing: killingTest
        "TestStatusDisclosesDeadOwnerAuthority"; before `Authority:             authorityProjection(state),`
        after `Authority:             Authority{},` (fix the exact alignment to the tree).
      - TestMutationAuthorityEpochCopyIsLoadBearing: killingTest
        "TestStatusAuthorityFencedVsNeverGrantedDistinguishable"; before
        `projection := Authority{Epoch: state.Authority.Epoch}` after
        `projection := Authority{Epoch: 0}` (epoch collapses to 0, so 2-vs-0 stops distinguishing).
      - TestMutationAuthorityOwnerNilBranchIsLoadBearing: killingTest
        "TestStatusTerminalRunDoesNotPaintOwner"; before
        `if state.Authority.Owner != nil && !terminal(string(state.Run)) {` after
        `if state.Authority.Owner != nil {` (drops the terminal guard, so a terminal run paints the
        owner and the test reds).

  GREP-PIN NOTE (cost a full cycle before): every PASS-line grep uses `grep -c -e '--- PASS: ...'`
  (leading dash guarded by `-e`), and every fence grep guards its pattern with `-e`. Go splits `-run`
  on `/`; every `-run` name here is a whole function name, grep-pinned against the source before the
  test is run. Do NOT truncate mutation output; do NOT report a timed-out command as a pass.

