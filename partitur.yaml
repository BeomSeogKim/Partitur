      `git status --porcelain` MUST be empty. If it lists anything, STOP and say so: the fence
      criteria (`production-code-untouched`, `change-scope`) cannot distinguish a stray file from
      your own work. Likewise STOP if any anchor drifted.

      Step 1 — READ THE PRECEDENT. Read
      cmd/partitur/supersession_kill_matrix_test.go:359-500 and state in one or two sentences, in
      your report, where in that function the live approver dies relative to the driver, and that
      the swap you are about to make brings the human-approval observed cut into agreement with it.

      Step 2 — RED FIRST, BUT AT THE SOURCE LEVEL. Before editing, run the `kill-order-swapped`
      acceptance command below on the UNTOUCHED tree and quote its output verbatim. It must FAIL,
      and its diagnostic line must show `k` greater than `d` (the approver kill after the driver
      kill). That is this run's only red. Do not attempt to reproduce the 3/50 runtime flake — the
      context explains why the sandbox cannot, and a failed reproduction attempt is not evidence.

      Step 3 — make the swap. In cmd/partitur/prepare_quiesce_harness_test.go, inside
      `TestHumanApprovalPreparedToObservedKillCuts`'s `prepare.prepared_to_observed/observed`
      subtest ONLY, exchange lines :231 and :232 so `killPausedRun(t, approver)` precedes
      `driver.kill(t)`. Add a SHORT comment above the pair saying why the approver must die first —
      that a released approver polls `CompleteOrAbandonPrepare` every 25ms and would take the fence
      path once the driver is reaped, durably approving the prepare the barrier assertion is about
      to test. Keep it to two or three lines and match the file's existing comment voice.

      Change NOTHING else. Not the `defer` order (both defers are idempotent stops and stay as they
      are). Not the `prepare.prepared_to_observed/prepared` subtest at :213-221 — its approver was
      never released, so it is not affected and must stay byte-identical. Not
      `assertPrepareBarrier`, not any helper, not any other file.

      Step 4 — prove it holds. Run and report the tail of each:

        go build ./...
        go vet ./cmd/partitur/
        go vet -tags=faultprobe ./cmd/partitur/
        GOMAXPROCS=1 go test -tags=faultprobe -count=1 -run '^TestHumanApprovalPreparedToObservedKillCuts$' -v ./cmd/partitur/
        go test -tags=faultprobe -count=1 ./cmd/partitur/

      Then run the `flaky-test-stress` and `catalogue-record-still-discharged` acceptance commands
      and report their tails. The 50-iteration stress takes roughly five minutes; do not truncate it
      and do not report a timed-out command as a pass.

      Step 5 — confirm the scope. Report `git status --porcelain` and `git diff` IN FULL (the diff
      is a handful of lines; quote all of it). Exactly ONE file may appear:
      cmd/partitur/prepare_quiesce_harness_test.go. NOTHING under internal/, no other file under
      cmd/partitur/, nothing in docs/, .github/, go.mod, go.sum, partitur.yaml, or .partitur/. Do
      not commit; the run captures the change set.

      In your report, say explicitly: that the stress criterion is CONFIRMATORY and the ordering
      criterion is the lock (the context explains why); that the cross-edge siblings carry the same
      latent hazard and were deliberately left alone; and that no mutation proof was added, by the
