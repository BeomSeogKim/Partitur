      Confirm the open interval was appended THROUGH THE STORE rather than by writing the journal
      file: `recoveryconsequence.AppendEvent` derives the close's `CausationID` from the
      `execution.started` event id (`internal/recoveryconsequence/consequence.go:733-741`), so a
