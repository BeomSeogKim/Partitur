movements:
  - id: swap-kill-order-approver-first
    part: writer
    needs: []
    grants: [repo_read, repo_write, shell]
    instruction: |
      Swap the kill order in the human-approval observed cut. Everything you write is English. The
      seam, the required end state, and the out-of-scope list are in this score's context; implement
      them, do not redesign them, and do not touch anything outside the one test file.

      Step 0 — CONFIRM THE GROUND, cheaply. Report the output of each, verbatim:

        git status --porcelain
        grep -n 'func TestHumanApprovalPreparedToObservedKillCuts' cmd/partitur/prepare_quiesce_harness_test.go
        sed -n '223,235p' cmd/partitur/prepare_quiesce_harness_test.go
        grep -n 'func killPausedRun' cmd/partitur/routed_proposal_kill_harness_test.go
        grep -n 'func (child \*preparedLiveRun) kill' cmd/partitur/prepare_quiesce_harness_test.go
        grep -n 'humanApprovalFixture = ' cmd/partitur/kill_harness_test.go
        grep -n 'prepare.prepared_to_observed/observed' cmd/partitur/kill_harness_test.go
        grep -n 'driver.kill(t)' cmd/partitur/cross_edge_pending_prepare_test.go cmd/partitur/cross_edge_cancellation_test.go

      You must see the test function at prepare_quiesce_harness_test.go:202, the observed subtest at
      :223 with `driver.kill(t)` at :231 IMMEDIATELY BEFORE `killPausedRun(t, approver)` at :232,
      both helpers calling `Wait()` after `Process.Kill()`, the catalogue constant at
      kill_harness_test.go:640 and its registration at :655, and the driver-first order in both
