           token appears. Run `grep -rn -e 'internal/procid' internal/status/` and
           `grep -rn -e 'procid\.' -e 'MatchOwner' -e 'recorded_owner_process_match' internal/status/` and
           quote the (empty) results. Any hit is a scope violation — fail it.
        2. PERMANENT OWNER BADGE: read `authorityProjection`. Confirm the owner is gated on
           `!terminal(string(state.Run))` using the existing helper, and that
           TestStatusTerminalRunDoesNotPaintOwner asserts a FAILED/terminal run with a non-nil
           `Authority.Owner` in state projects `owner: null`. If a terminal run paints an owner, fail.
        3. NEVER-GRANTED vs FENCED conflated: confirm epoch 0 + owner null and epoch > 0 + owner null
           are distinguishable from the JSON alone (TestStatusAuthorityFencedVsNeverGrantedDistinguishable).
        4. HUMAN LINE ADDED (b snuck in): confirm cmd/partitur/main.go is byte-unchanged (`git diff --
           cmd/partitur/main.go` empty) and that TestStatusTextRendererStaysByteFrozenForDeadOwner
           asserts the dead-owner text output carries no authority/owner/pid substring.
        5. SKIPPED-RUNS (c snuck in): `grep -rn -e 'skipped_unreadable_runs' -e 'observation' internal/status/`
           and confirm the ErrNoActiveRun detail string is unchanged. Any new field is a violation.
        6. SPEC EDIT: `git status --porcelain -- docs/` and `git diff -- docs/` MUST be empty. The
           clause-staging blob and DESIGN.md are byte-frozen.
        7. LOCKS BROKEN: recovery.state stays NOT_REQUIRED and run.lifecycle stays RUNNING on the
           dead-owner fixture; exit 0/2/5 unchanged; status --json is exactly one JSON document; the
           fail-closed scan tests still pass.
        8. MUTATION NOT LOAD-BEARING: each of the three mutation cases must map to a DISTINCT conjunct
           (assembly, epoch copy, owner-nil/terminal branch) and each `before` must occur exactly once
           in status.go. Re-run `authority-mutation-proof` and quote the three PASS lines. Confirm the
           `after` of the owner-nil case removes the terminal guard (so the terminal test is what
           kills it), not something that also breaks the assembly.
        9. FALSE GREEN by disabled/renamed test, or a timed-out mutation run reported as a pass.

      1. SCOPE, BY READING THE WHOLE DIFF. Run `git status --porcelain` and `git diff`, quote BOTH in
      full. Exactly four files may appear: internal/status/status.go,
      internal/status/authority_disclosure_test.go, internal/status/mutation_test.go,
      cmd/partitur/status_authority_disclosure_test.go. Any other path is a scope violation.

      2. RED WITHOUT THE FIX. Take the disclosure test's assertions and confirm they would RED on the
      base status.go (which has no authority field) — e.g. write the base
      `git show <base>:internal/status/status.go` into a scratch tree and run
      TestStatusDisclosesDeadOwnerAuthority against it, or reason from the diff and say so explicitly.

      3. RE-RUN THE EVIDENCE YOURSELF. Run and report the tail of each:

        go build ./...
        go vet ./internal/status/ && go vet ./cmd/partitur/ && go vet -tags=mutation ./internal/status/
        go test -count=1 -run '^(TestStatusDisclosesDeadOwnerAuthority|TestStatusAuthorityFencedVsNeverGrantedDistinguishable|TestStatusTerminalRunDoesNotPaintOwner|TestStatusDeadOwnerKeepsRecoveryAndLifecycle)$' -v ./internal/status/
        go test -count=1 -run '^(TestStatusJSONCarriesAuthorityObject|TestStatusTextRendererStaysByteFrozenForDeadOwner)$' -v ./cmd/partitur/

      If any point above does not hold, say so plainly rather than passing it.
    inputs: [authority-observability-change-set]
    acceptance:
      hard:
        - id: build
          run: ["go", "build", "./..."]
          timeout_min: 10
        - id: vet
          run: ["sh", "-c", "go vet ./internal/status/ && go vet ./cmd/partitur/ && go vet -tags=mutation ./internal/status/"]
          timeout_min: 10
        - id: dead-owner-disclosed
          run: ["sh", "-c", "grep -q -e 'func TestStatusDisclosesDeadOwnerAuthority(' internal/status/authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusDisclosesDeadOwnerAuthority$' -v ./internal/status/ > \"$log\" 2>&1; status=$?; tail -30 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusDisclosesDeadOwnerAuthority' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: fenced-vs-never-granted-distinguishable
          run: ["sh", "-c", "grep -q -e 'func TestStatusAuthorityFencedVsNeverGrantedDistinguishable(' internal/status/authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusAuthorityFencedVsNeverGrantedDistinguishable$' -v ./internal/status/ > \"$log\" 2>&1; status=$?; tail -30 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusAuthorityFencedVsNeverGrantedDistinguishable' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: terminal-owner-not-painted
          run: ["sh", "-c", "grep -q -e 'func TestStatusTerminalRunDoesNotPaintOwner(' internal/status/authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusTerminalRunDoesNotPaintOwner$' -v ./internal/status/ > \"$log\" 2>&1; status=$?; tail -30 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusTerminalRunDoesNotPaintOwner' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: status-json-carries-authority
          run: ["sh", "-c", "grep -q -e 'func TestStatusJSONCarriesAuthorityObject(' cmd/partitur/status_authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusJSONCarriesAuthorityObject$' -v ./cmd/partitur/ > \"$log\" 2>&1; status=$?; tail -30 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusJSONCarriesAuthorityObject' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: recovery-and-lifecycle-unchanged
          run: ["sh", "-c", "grep -q -e 'func TestStatusDeadOwnerKeepsRecoveryAndLifecycle(' internal/status/authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusDeadOwnerKeepsRecoveryAndLifecycle$' -v ./internal/status/ > \"$log\" 2>&1; status=$?; tail -20 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusDeadOwnerKeepsRecoveryAndLifecycle' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: text-renderer-byte-frozen
          run: ["sh", "-c", "grep -q -e 'func TestStatusTextRendererStaysByteFrozenForDeadOwner(' cmd/partitur/status_authority_disclosure_test.go || { echo MISSING-TEST; exit 1; }; log=$(mktemp); go test -count=1 -run '^TestStatusTextRendererStaysByteFrozenForDeadOwner$' -v ./cmd/partitur/ > \"$log\" 2>&1; status=$?; tail -20 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestStatusTextRendererStaysByteFrozenForDeadOwner' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: status-does-not-import-procid
          run: ["sh", "-c", "! grep -rn -e 'internal/procid' internal/status/"]
          timeout_min: 5
        - id: no-skipped-unreadable-runs-field
          run: ["sh", "-c", "! grep -rn -e 'skipped_unreadable_runs' internal/ cmd/"]
          timeout_min: 5
        - id: fail-closed-scan-unchanged
          run: ["sh", "-c", "log=$(mktemp); go test -count=1 -run '^(TestUnreadableRunStillBlocksApplicationPreconditionScan|TestStatusSelectedUnreadableRunStillHaltsWithExitFive)$' -v ./cmd/partitur/ > \"$log\" 2>&1; status=$?; tail -30 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestUnreadableRunStillBlocksApplicationPreconditionScan' \"$log\")\" -ge 1 && test \"$(grep -c -e '--- PASS: TestStatusSelectedUnreadableRunStillHaltsWithExitFive' \"$log\")\" -ge 1"]
          timeout_min: 10
        - id: authority-mutation-proof
          run: ["sh", "-c", "for f in TestMutationAuthorityAssemblyIsLoadBearing TestMutationAuthorityEpochCopyIsLoadBearing TestMutationAuthorityOwnerNilBranchIsLoadBearing; do grep -q -e \"func $f(\" internal/status/mutation_test.go || { echo MISSING-MUTATION $f; exit 1; }; done; log=$(mktemp); go test -tags=mutation -count=1 -timeout=30m -run '^(TestMutationAuthorityAssemblyIsLoadBearing|TestMutationAuthorityEpochCopyIsLoadBearing|TestMutationAuthorityOwnerNilBranchIsLoadBearing)$' -v ./internal/status/ > \"$log\" 2>&1; status=$?; tail -60 \"$log\"; test $status -eq 0 && test \"$(grep -c -e '--- PASS: TestMutationAuthorityAssemblyIsLoadBearing' \"$log\")\" -ge 1 && test \"$(grep -c -e '--- PASS: TestMutationAuthorityEpochCopyIsLoadBearing' \"$log\")\" -ge 1 && test \"$(grep -c -e '--- PASS: TestMutationAuthorityOwnerNilBranchIsLoadBearing' \"$log\")\" -ge 1"]
          timeout_min: 40
        - id: spec-and-ledger-untouched
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- docs/ .github/ go.mod go.sum partitur.yaml .partitur/)\""]
          timeout_min: 5
        - id: production-code-scope
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- internal/ cmd/ | grep -v -e '_test\\.go$' | grep -v -e 'internal/status/status\\.go$')\""]
          timeout_min: 5
        - id: change-scope
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- . | grep -v -e 'internal/status/status\\.go$' | grep -v -e 'internal/status/authority_disclosure_test\\.go$' | grep -v -e 'internal/status/mutation_test\\.go$' | grep -v -e 'cmd/partitur/status_authority_disclosure_test\\.go$')\""]
          timeout_min: 5
      human_gate: always

policy:
  allowed_paths:
    - "internal/status/status.go"
    - "internal/status/authority_disclosure_test.go"
    - "internal/status/mutation_test.go"
    - "cmd/partitur/status_authority_disclosure_test.go"
  side_effects: []
  budget:
    active_wall_clock_min: 180
    retries_per_movement: 1
  amendment:
    auto: "off"
