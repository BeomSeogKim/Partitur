      Then run every acceptance command below yourself and report each result.
    outputs:
      - id: kill-order-change-set
        kind: change_set
    acceptance:
      hard:
        - id: build
          run: ["go", "build", "./..."]
          timeout_min: 10
        - id: vet
          run: ["sh", "-c", "go vet ./cmd/partitur/ && go vet -tags=faultprobe ./cmd/partitur/"]
          timeout_min: 10
        - id: kill-order-swapped
          run: ["sh", "-c", "f=cmd/partitur/prepare_quiesce_harness_test.go; tf=$(grep -nF 'func TestHumanApprovalPreparedToObservedKillCuts(t *testing.T) {' $f | cut -d: -f1); test -n \"$tf\" || exit 1; s=$(awk -v t=$tf -v p='prepare.prepared_to_observed/observed' 'NR>t && index($0,p) {print NR; exit}' $f); test -n \"$s\" || exit 1; e=$(awk -v s=$s -v p='assertPrepareBarrier(' 'NR>s && index($0,p) {print NR; exit}' $f); test -n \"$e\" || exit 1; r=$(awk -v s=$s -v e=$e -v p='releasePausedReceipt(t, approver)' 'NR>s && NR<e && index($0,p) {print NR; exit}' $f); k=$(awk -v s=$s -v e=$e -v p='killPausedRun(t, approver)' 'NR>s && NR<e && index($0,p) {print NR; exit}' $f); d=$(awk -v s=$s -v e=$e -v p='driver.kill(t)' 'NR>s && NR<e && index($0,p) {print NR; exit}' $f); kn=$(awk -v s=$s -v e=$e -v p='killPausedRun(t, approver)' 'NR>s && NR<e && index($0,p) {n++} END {print n+0}' $f); dn=$(awk -v s=$s -v e=$e -v p='driver.kill(t)' 'NR>s && NR<e && index($0,p) {n++} END {print n+0}' $f); echo \"observed-cut block: test=$tf subtest=$s barrier=$e release=$r approver_kill=$k driver_kill=$d approver_kills=$kn driver_kills=$dn\"; test -n \"$r\" && test -n \"$k\" && test -n \"$d\" && test \"$kn\" -eq 1 && test \"$dn\" -eq 1 && test \"$r\" -lt \"$k\" && test \"$k\" -lt \"$d\""]
          timeout_min: 5
        - id: flaky-test-stress
          run: ["sh", "-c", "grep -qF 'func TestHumanApprovalPreparedToObservedKillCuts(t *testing.T) {' cmd/partitur/prepare_quiesce_harness_test.go && GOMAXPROCS=1 go test -tags=faultprobe -count=1 -timeout=5m -run '^TestHumanApprovalPreparedToObservedKillCuts$' -v ./cmd/partitur/ | grep -c '^--- PASS: TestHumanApprovalPreparedToObservedKillCuts ' | grep -qx 1 && GOMAXPROCS=1 go test -tags=faultprobe -count=50 -timeout=14m -run '^TestHumanApprovalPreparedToObservedKillCuts$' ./cmd/partitur/"]
