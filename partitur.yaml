score: "0.2"
name: issue-441-name-the-budget-in-the-interrupt
revision: 1
status: finalized

goal: |
  Fix issue #441's diagnostic half. When the run's active wall-clock budget expires while the
  adapter is executing, `partitur run` today exits 6 with `detail="context deadline exceeded"`,
  which names neither the budget nor how much of it was left when the call started, and does not
  say whether resuming is legal. Introduce a typed cause carried out of the live adapter call and
  render it: the interrupt line gains a `resume_condition` field, and a budget expiry renders a
  detail that names the budget and its `remaining_at_start_ms`.

  The outcome does not change. It stays INTERRUPTED, exit 6, nonterminal, with no new journal
  event and no terminalization chain.

context: |
  THE DEFECT, LOCATED.

  `internal/driver/driver.go:1084-1087` wraps the live adapter call in a budget deadline:

      executeContext, cancel := context.WithTimeout(
          ctx,
          budgetTimeout(remainingMS),
      )

  `remainingMS` is the run's remaining active wall-clock budget in milliseconds
  (`driver.go:547`, `execution.RemainingMS`; `budgetTimeout` at `driver.go:2190-2197` converts it
  to a `time.Duration`). The adapter returns bare `ctx.Err()` when that deadline fires. The error
  reaches `stopped()` (`driver.go:2685-2698`), matches none of its four sentinels, and falls
  through `default:` to `interrupted()` (`driver.go:2700-2705`), which sets
  `Outcome = OutcomeInterrupted`, clears `Reason`, and PRESERVES `Err`.
  `cmd/partitur/main.go:350-352` then calls `renderRunInterruption` and returns 6.

  So the operator sees:

      run interrupted: run_id="…" state="nonterminal" resume="partitur resume …" detail="context deadline exceeded"

  Three things are missing from that line and each of them costs a human a manual investigation:
  which deadline expired (the run's own budget, or something enclosing it), how much budget the
  call started with, and whether resuming is safe given that the adapter interval is still open.

  WHAT THIS RUN DELIBERATELY DOES NOT FIX — READ THIS BEFORE YOU DESIGN ANYTHING.

  `DESIGN.md:2338-2350` requires a terminal path for mid-flight exhaustion: "If the budget runs
  out while an adapter or an acceptance command is running, the attempt must be terminalized
  before the movement can fail," with the literal chain
  `execution.stopped{budget_exhausted} -> attempt.failed{budget_exhausted} -> movement.failed -> run.failed`.
  The live driver implements none of that for the ADAPTER arm. That is a genuine spec deviation,
  and a two-party design gate on 2026-09-10 split it out deliberately:

    - THIS run (#441) is the DIAGNOSTIC half: a typed error plus a renderer. Outcome, exit code,
      state and journal are untouched.
    - The CONFORMANCE repair is issue #447 and is OUT OF SCOPE HERE.

  Therefore: do NOT append `execution.stopped`, do NOT call `TerminalizeAcceptanceBudget`
  (`internal/driver/acceptance_budget.go:17`), do NOT touch `classifyAttemptFailure`, do NOT
  change `Outcome`, `Reason`, or the exit code, and do NOT add a field to `driver.Result`. One
  acceptance criterion below (`no-terminalization-vocabulary`) enforces that fence mechanically,
  and the verifier movement checks it again by reading the whole diff. If you believe the
  conformance repair belongs here, STOP and say so in your report; do not implement it.

  THE AGREED DESIGN (design gate, two parties, 2026-09-10 — implement it, do not redesign it).

  1. A typed error in a NEW file `internal/driver/budget.go`:

         type ActiveBudgetExhaustedError struct {
             RemainingAtStartMS int64
         }

     with a pointer receiver `Error() string` returning EXACTLY

         active execution budget expired: remaining_at_start_ms=%d; live budget terminalization was not recorded

     (`%d` is `RemainingAtStartMS`), and a pointer receiver `Unwrap() error` returning
     `context.DeadlineExceeded`, so every existing `errors.Is(err, context.DeadlineExceeded)`
     caller keeps working. A STRUCT, not a sentinel, because the remaining-at-start value is
     carried on it. The naming precedent for driver-owned budget errors is
     `ErrCompositionBudgetExhausted` (`internal/driver/movement_composition.go:24`), which is a
     sentinel because it carries nothing; this one carries a value, so it is a type.

  2. `context.WithTimeoutCause` at `driver.go:1084-1087`, with the typed error as the cause:

         executeContext, cancel := context.WithTimeoutCause(
             ctx,
             budgetTimeout(remainingMS),
             &ActiveBudgetExhaustedError{RemainingAtStartMS: remainingMS},
         )

     Construct the cause INLINE, inside the call. Do not hoist it into a named variable: the
     mutation proof below replaces this whole call with the original `context.WithTimeout` form,
     and a hoisted variable would become unused and turn the mutation into a compile failure
     instead of a killed test.

  3. Read the cause BEFORE `cancel()`. `cancel()` is at `driver.go:1105`, immediately after the
     `dependencies.client.Execute(...)` call returns. THIS ORDERING IS LOAD-BEARING: after
     `cancel()` runs, `context.Cause(executeContext)` reports `context.Canceled` and the typed
     cause is gone forever. So capture it first:

         executeCause := context.Cause(executeContext)
         cancel()
         err = activeBudgetError(err, executeCause)

     `activeBudgetError` is a small helper (put it in `budget.go`) that substitutes ONLY under
     both conjuncts:

         // activeBudgetError names the run's own active budget as the reason the adapter context
         // ended. It substitutes only when the adapter reported a deadline AND the deadline that
         // fired is the one this call installed. A parent cancellation, or an enclosing deadline
         // that is not ours, keeps its ordinary interruption error.
         func activeBudgetError(err, cause error) error {
             if !errors.Is(err, context.DeadlineExceeded) {
                 return err
             }
             var exhausted *ActiveBudgetExhaustedError
             if !errors.As(cause, &exhausted) {
                 return err
             }
             return exhausted
         }

     Both conjuncts matter and each has a control test below. Substituting once here, right after
     the capture, covers both downstream arms (the `approvalPrepared` arm at `driver.go:1106-1108`
     and the ordinary arm at `driver.go:1136-1143`) from a single site.

  4. NO adapter change. The adapter keeps returning bare `ctx.Err()`; the driver owns the naming.

  5. NO new `driver.Result` field. `interrupted()` already preserves `Err`, so `errors.As` at the
     command boundary is enough to discriminate.

  6. The renderer, `renderRunInterruption` at `cmd/partitur/main.go:1466-1475`. Its format string
     becomes

         "run interrupted: run_id=%q state=%q resume=%q resume_condition=%q detail=%q\n"

     and the new operand is a condition string computed from the error:

         - when `errors.As(result.Err, &exhausted)` with `*driver.ActiveBudgetExhaustedError`:
           `legal; recovery must reconcile the open adapter interval before deciding the next durable action`
         - otherwise: `ready`

     `detail` stays `errorText(result.Err)` unchanged — the budget wording arrives through the
     typed error's own `Error()` string, so the renderer special-cases the condition and nothing
     else. `errors` is already imported in `main.go`.

     ONLY `renderRunInterruption` changes. `renderResumeInterruption`
     (`cmd/partitur/main.go:1044-1050`) and the eight other literal `run interrupted:` Fprintf
     sites (`main.go:510, 528, 568, 581, 641, 659, 765, 937`) belong to the apply, promotion,
     amendment and resume paths, which never carry a live adapter budget error. Leave every one
     of them alone. Verified: `renderRunInterruption` has exactly one caller,
     `cmd/partitur/main.go:351`.

  THE PINNED TEST YOU MUST UPDATE DELIBERATELY, NOT WEAKEN.

  `cmd/partitur/main_test.go:1134-1144` pins the current interrupt line BYTE-FOR-BYTE inside
  `TestRunPrintsDurableIDOnceBeforeTerminalOutcome` (the comparison is `stderr.String() !=
  test.stderr` at `main_test.go:1180`). `cmd/partitur/main_test.go:1224-1228` pins it again inside
  `TestRunIDWriteFailureIsOperationalInterruption`. Both go through `renderRunInterruption` and
  both MUST be updated to the new byte-exact shape.

  This repository's lesson L40 is that a loosened assertion loses its lock: when you widen an
  exact-equality pin, enumerate exactly what the widening admits and pin each new thing.
  Here the widening admits exactly ONE new field, `resume_condition`, in exactly TWO states, so:

    - Keep BOTH tests on byte equality. Do NOT convert either to `strings.Contains`, to a prefix
      check, or to a regexp. A `Contains` here would pass whether the condition said `ready`,
      `legal; …`, or nothing at all.
    - Update the existing rows to carry `resume_condition="ready"`.
    - ADD a new row to `TestRunPrintsDurableIDOnceBeforeTerminalOutcome` whose `err` is
      `&driver.ActiveBudgetExhaustedError{RemainingAtStartMS: 60_000}`, `code` is 6, and whose
      `stderr` is byte-exactly

          "run interrupted: " +
              "run_id=\"019d0000-0000-7000-8000-000000000001\" " +
              "state=\"nonterminal\" " +
              "resume=\"partitur resume 019d0000-0000-7000-8000-000000000001\" " +
              "resume_condition=\"legal; recovery must reconcile the open adapter interval before deciding the next durable action\" " +
              "detail=\"active execution budget expired: remaining_at_start_ms=60000; live budget terminalization was not recorded\"\n"

  `cmd/partitur/command_matrix_witness_test.go:554` also pins a `run interrupted:` line, but it is
  the RESUME-009 witness driving `partitur resume`, which renders through
  `renderResumeInterruption`. It must NOT change. If your diff touches it, your renderer change
  leaked into the wrong function.

  THE LIVE TEST SEAM.

  `internal/driver/driver_test.go:1849` (`TestLiveAcceptanceBudgetExhaustionTerminalizesAttemptBeforeMovement`)
  is the closest working example of driving the live execution path in a unit test: it prepares a
  runnable fixture, acquires the driver authority, appends `movement.ready` and `movement.started`,
  swaps `dependencies.client` for an adapter fixture, and calls

      ExecuteAttempt(context.Background(), AttemptExecution{…, RemainingMS: 1_000}, executionDependenciesFrom(dependencies))

  Read it before you write anything; copy its fixture construction rather than inventing one.
  Note that `RemainingMS` is settable per call, so `budgetTimeout(50)` gives a 50ms deadline. Do
  NOT pass `RemainingMS: 0` — `budgetTimeout(0)` yields an already-expired context and would test
  a different thing (a known incidental hazard, out of scope).

  No existing adapter fixture in `driver_test.go` observes its context: `waitingAdapterFixture`
  (:2872), `deliveredInputAdapterFixture` (:2926), `completedAdapterFixture` (:2994) and
  `adapterResolutionFailureFixture` (:2866) all ignore it. You will need one new fixture that
  blocks on `<-ctx.Done()` and returns `adapter.ExecuteReport{}, ctx.Err()` — bare, exactly as the
  real adapter does. Put it beside the existing fixtures in `driver_test.go`.

  THE MUTATION PROOF USES THE HELPER THAT IS ALREADY THERE.

  `internal/driver/mutation_test.go` already carries `//go:build mutation` and a helper that does
  precisely what this proof needs: `assertDriverMutationKilledUnique` (`mutation_test.go:667-681`)
  asserts the anchor occurs EXACTLY ONCE in the real source before mutating, then delegates to
  `assertDriverMutationKilledAt`, which copies the repository into `t.TempDir()` skipping `.git`
  and `.partitur` (`copyMutationRepository`, :820-866), rewrites the anchor, and drives the child
  through `internal/mutationtest`. Use it. Do not write a new copy helper and do not create a new
  file.

  ONE CLASSIFIER FACT THAT DECIDES THE MUTATION'S TARGET. `internal/mutationtest/child.go:190-205`
  reports `Killed` only when EVERY named target failed. The control test survives this mutation by
  construction — it asserts that a non-budget context ending is NOT a budget error, which stays
  true when the cause is never installed. So the mutation must name ONLY the budget-discrimination
  test. Naming both would report "mixed outcomes" and the criterion could never pass. Run the
  control test by hand inside a scratch copy afterwards and report what it does, so the survival
  is recorded rather than assumed.

  SCORE PLACEMENT. This score temporarily replaces the committed reference-workflow score because
  `partitur run` reads only `<repo>/partitur.yaml` and takes no score operand (#435). It is
  reverted before the pull request; only the `internal/driver/` and `cmd/partitur/` change is
  meant to land.

