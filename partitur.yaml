          timeout_min: 5

  - id: confirm
    part: verifier
    needs: [name-the-budget-in-the-interrupt]
    grants: [repo_read, shell]
    instruction: |
      Confirm the issue #441 Branch-B fix. Change no file in this repository. Report in English.

      This change is small. The three ways it can be wrong are: it can quietly implement #447's
      conformance repair, it can weaken a byte-exact pin while claiming to update it, and it can
      get the cause/cancel ordering right by accident rather than by construction. Spend your
      effort on points 2, 3, 4 and 5.

      1. SCOPE, BY READING THE WHOLE DIFF. Run `git status --porcelain` and `git diff --stat` and
      report both verbatim, then READ `git diff` in full — not a summary of it. At most six paths
      may appear: `internal/driver/budget.go` (new), `internal/driver/driver.go`,
      `internal/driver/driver_test.go`, `internal/driver/mutation_test.go`,
      `cmd/partitur/main.go`, `cmd/partitur/main_test.go`. A change to `DESIGN.md`, to
      `internal/docclause/`, to `cmd/partitur/command_matrix_witness_test.go`, to any other
      package, to `partitur.yaml` or to `.partitur/cast.yaml` is a scope violation and a failure —
      say so rather than passing it.

      2. NO CONFORMANCE REPAIR LEAKED IN. This is the fence that matters most. Issue #441's
      conformance half is issue #447 and must NOT be here. Confirm by reading the diff that it
      contains: no new `execution.stopped` append site, no call to `TerminalizeAcceptanceBudget`
      (`internal/driver/acceptance_budget.go:17`), no change to `classifyAttemptFailure`, no new
      `driver.Result` field, no change to `Outcome`, `Reason` or the exit code for this path, and
      no new journal event of any kind. Then confirm positively that the outcome semantics are
      still what the score promised: the budget path still ends INTERRUPTED with an empty
      `Reason`, and `cmd/partitur/main.go` still returns 6 for `driver.OutcomeInterrupted`. Quote
      the lines you used. A run that landed the terminal chain here is a failure even if every
      test is green.

      3. THE PINS WERE UPDATED, NOT WEAKENED. `cmd/partitur/main_test.go:1134-1144` (in
      `TestRunPrintsDurableIDOnceBeforeTerminalOutcome`) and `main_test.go:1224-1228` (in
      `TestRunIDWriteFailureIsOperationalInterruption`) both pinned the interrupt line byte-for-byte
      before this change. Compare each against the pre-change revision line by line
      (`git diff -- cmd/partitur/main_test.go`). Confirm:
        - the comparison in each is STILL byte equality (`stderr.String() != …`), not
          `strings.Contains`, not a prefix check, not a regexp,
        - the only textual difference in each existing expectation is the insertion of
          `resume_condition="ready" ` in its correct position, and
        - a NEW row exists carrying `&driver.ActiveBudgetExhaustedError{RemainingAtStartMS: 60_000}`
          whose expected bytes contain BOTH `resume_condition="legal; recovery must reconcile the
          open adapter interval before deciding the next durable action"` AND
          `detail="active execution budget expired: remaining_at_start_ms=60000; live budget
          terminalization was not recorded"`.
      This repository's lesson L40 is that widening an exact-equality assertion loses its lock
      unless you enumerate what the widening admits and pin each item. Here the widening admits
      exactly one new field in exactly two states, and both states must be pinned by byte
      equality. If either is only implied, say so.

      Also confirm `cmd/partitur/command_matrix_witness_test.go:554` is UNCHANGED. It renders
      through `renderResumeInterruption`, which this change must not touch; if it moved, the
      renderer edit leaked into the wrong function. Confirm too that the eight other literal
      `run interrupted:` Fprintf sites in `main.go` (:510, :528, :568, :581, :641, :659, :765, :937)
      still carry the OLD four-field format.

      4. THE ORDERING IS LOAD-BEARING AND WAS BUILT THAT WAY. Read
      `internal/driver/driver.go` around the adapter call. Confirm by line number that
      `context.Cause(executeContext)` is read BEFORE `cancel()`, and state why that matters in your
      own words: after `cancel()` the cause reports `context.Canceled` and the typed cause is
      unrecoverable. The writer claims to have measured this by moving the read after `cancel()`
      and watching the budget test fail with an observed cause of `context.Canceled`. Reproduce
      that yourself in a scratch copy of the repository OUTSIDE this worktree (do NOT modify this
      worktree): move the read after `cancel()`, run
      `go test -count=1 -v -run '^TestLiveAdapterBudgetDeadlineNamesTheActiveBudget$' ./internal/driver/`,
      and report whether it fails and what the failure says. If a scratch copy is impractical, say
      exactly why and reason from the source instead — and mark the conclusion as UNMEASURED.

      Also confirm the cause is constructed INLINE in the `context.WithTimeoutCause` call rather
      than hoisted into a variable. That is not style: a hoisted variable would go unused under the
      mutation in point 6, turning a kill into a build failure.

      5. BOTH CONJUNCTS OF THE SUBSTITUTION ARE GUARDED. Read `activeBudgetError` in
      `internal/driver/budget.go`. It must substitute only when the returned error is
      `context.DeadlineExceeded` AND the captured cause is an `*ActiveBudgetExhaustedError`. Then
      read `TestLiveAdapterNonBudgetContextEndingsStayOrdinaryInterruptions` and confirm each
      subtest actually holds one conjunct:
        - the "parent cancellation" subtest exercises the first conjunct (error is `Canceled`, not
          a deadline), and
        - the "enclosing deadline" subtest exercises the SECOND conjunct — the error IS
          `context.DeadlineExceeded` and the ONLY thing that prevents substitution is the cause
          check. If that second subtest is missing, or if it uses a cancellation rather than a
          deadline, the cause conjunct is untested and you must say so.
      Confirm also that `TestLiveAdapterBudgetDeadlineNamesTheActiveBudget` asserts the EXACT
      `RemainingAtStartMS` value rather than merely that it is nonzero, and that it pins
      `errors.Is(result.Err, context.DeadlineExceeded)` so the `Unwrap` contract cannot be dropped
      silently.

      6. THE MUTATION PROOF IS REAL, AND ITS SCOPE IS HONEST. Read
      `TestMutationLiveAdapterBudgetDeadlineCarriesTheTypedCause` in
      `internal/driver/mutation_test.go`. Confirm it goes through
      `assertDriverMutationKilledUnique` (which asserts the anchor occurs exactly once and fails
      with the count otherwise), that the anchor is the whole `context.WithTimeoutCause` call and
      the replacement is the plain `context.WithTimeout` form, and that it names ONLY
      `TestLiveAdapterBudgetDeadlineNamesTheActiveBudget` as the target. Then confirm the thing
      most likely to be glossed over: the writer's report must state that
      `TestLiveAdapterNonBudgetContextEndingsStayOrdinaryInterruptions` SURVIVES this mutation, and
      that this is why it is not a target. `internal/mutationtest/child.go:190-205` reports
      `Killed` only when every target failed, so naming both would make the criterion
      unsatisfiable. If the report instead claims the control test is killed, that claim is false
      and you must say so.

      7. THE RED-FIRST EVIDENCE IS REAL. An absence check ("the criterion was red because the type
      did not exist yet") is NOT sufficient evidence on its own — say so if that is all the writer
      has. For each of the writer's four Layer-2 constructions, say which of your own observations
      supports the conclusion and whether the writer's quoted failure text matches what you saw.

      8. RE-RUN THE EVIDENCE YOURSELF. Run and report the tail of each:

        go build ./...
        go vet ./internal/driver/ ./cmd/partitur/
        go test -count=1 -v -run '^(TestLiveAdapterBudgetDeadlineNamesTheActiveBudget|TestLiveAdapterNonBudgetContextEndingsStayOrdinaryInterruptions)$' ./internal/driver/
        go test -count=1 ./internal/driver/
        go test -count=1 -v -run '^(TestRunPrintsDurableIDOnceBeforeTerminalOutcome|TestRunIDWriteFailureIsOperationalInterruption)$' ./cmd/partitur/
        go test -count=1 ./cmd/partitur/
        go test -tags=mutation -count=1 -v -run '^TestMutationLiveAdapterBudgetDeadlineCarriesTheTypedCause$' ./internal/driver/

      9. NEVER run `go test -tags=mutation ./...` (#316 — that whole-repository battery is a known
      starvation hazard and will red unrelated tests). Every tagged command is scoped to
      `./internal/driver/`.

      If any point above does not hold, say so plainly rather than passing it.
    inputs: [active-budget-interrupt-change-set]
