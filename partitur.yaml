          timeout_min: 20
        - id: mutation-proof
          run: ["sh", "-c", "grep -qF \"func TestMutationExecuteCancellationLivenessBoundMustStayBelowTheClientDeadline(t *testing.T) {\" internal/adapter/mutation_test.go && go test -tags=mutation -count=1 -run '^TestMutationExecuteCancellationLivenessBoundMustStayBelowTheClientDeadline$' -v ./internal/adapter/ | grep -q '^--- PASS: TestMutationExecuteCancellationLivenessBoundMustStayBelowTheClientDeadline'"]
          timeout_min: 25
        - id: deadline-constants-untouched
          run: ["sh", "-c", "f=internal/adapter/client_test.go; test \"$(grep -cF 'incidentalTestDeadline      = 10 * time.Second' $f)\" = 1 && test \"$(grep -cF 'fixtureOwnerReapTimeout   = incidentalTestDeadline / 2' $f)\" = 1 && test -z \"$(git status --porcelain -- internal/adapter/client_test.go)\""]
          timeout_min: 5
        - id: change-scope
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- internal/ | grep -v 'internal/adapter/')\" && test -z \"$(git status --porcelain -- internal/adapter/ | grep -v 'internal/adapter/execute_test.go' | grep -v 'internal/adapter/mutation_test.go')\" && test -z \"$(git status --porcelain -- cmd/ docs/ integration/ .github/ go.mod go.sum)\""]
          timeout_min: 5
        - id: gates-carry-no-parallelism-bound
          run: ["sh", "-c", "test \"$(grep -cF ' -p ' .github/workflows/go.yml)\" = 0"]
          timeout_min: 5
      human_gate: always

policy:
  allowed_paths:
    - "internal/adapter/*_test.go"
  side_effects: []
  budget:
    active_wall_clock_min: 150
    retries_per_movement: 1
  amendment:
    auto: "off"
