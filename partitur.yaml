        - id: mutation-proof
          run: ["sh", "-c", "grep -qF \"func TestMutationLiveAdapterBudgetDeadlineCarriesTheTypedCause(t *testing.T) {\" internal/driver/mutation_test.go && go test -tags=mutation -count=1 -run '^TestMutationLiveAdapterBudgetDeadlineCarriesTheTypedCause$' -v ./internal/driver/ | grep -q '^--- PASS: TestMutationLiveAdapterBudgetDeadlineCarriesTheTypedCause'"]
          timeout_min: 30
        - id: change-scope
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- internal/ | grep -v 'internal/driver/')\" && test -z \"$(git status --porcelain -- internal/driver/ | grep -vE 'internal/driver/(budget\\.go|budget_test\\.go|driver\\.go|driver_test\\.go|mutation_test\\.go)$')\" && test -z \"$(git status --porcelain -- cmd/ | grep -vE 'cmd/partitur/(main\\.go|main_test\\.go)$')\" && test -z \"$(git status --porcelain -- docs/ integration/ .github/ go.mod go.sum partitur.yaml .partitur/ DESIGN.md AGENTS.md)\""]
