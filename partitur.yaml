      Do NOT add `TestExecuteCancellationDuringLaunchEndsTheCall` as a second target: the
      classifier at `internal/mutationtest/child.go:190-205` reports `Killed` only when every
      target failed, and that test passes under this mutation (you measured it in step 1). Instead,
      after the criterion is green, run once by hand in a scratch copy outside this worktree the
