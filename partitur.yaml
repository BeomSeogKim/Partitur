      line. If any field is computed rather than copied, say so.

      Confirm positively that the schema string is still `partitur/status+json;v=1` and that the
      `Budget` field was APPENDED to `Report` rather than inserted among the existing fields, so
      the encoded key order of every pre-existing field is unchanged.

