        - id: budget-discrimination-pinned
          run: ["sh", "-c", "f=internal/driver/driver_test.go; for n in TestLiveAdapterBudgetDeadlineNamesTheActiveBudget TestLiveAdapterNonBudgetContextEndingsStayOrdinaryInterruptions; do grep -qF \"func $n(t *testing.T) {\" $f || exit 1; done; go test -count=1 -run '^(TestLiveAdapterBudgetDeadlineNamesTheActiveBudget|TestLiveAdapterNonBudgetContextEndingsStayOrdinaryInterruptions)$' -v ./internal/driver/ | grep -c '^--- PASS: TestLiveAdapter' | grep -qx 2"]
          timeout_min: 20
        - id: renderer-shape-pinned
          run: ["sh", "-c", "m=cmd/partitur/main.go; t=cmd/partitur/main_test.go; test \"$(grep -cF 'state=%q resume=%q resume_condition=%q detail=%q' $m)\" = 1 && test \"$(grep -cF 'legal; recovery must reconcile the open adapter interval before deciding the next durable action' $m)\" = 1 && test \"$(grep -cF 'legal; recovery must reconcile the open adapter interval before deciding the next durable action' $t)\" = 1 && test \"$(grep -cF 'active execution budget expired: remaining_at_start_ms=60000; live budget terminalization was not recorded' $t)\" = 1 && test \"$(grep -cF 'resume_condition=' $t)\" -ge 3 && test \"$(grep -cF 'stderr.String() != test.stderr' $t)\" -ge 1 && test \"$(grep -cF 'stdout.calls != 1 || stderr.String() != wantStderr' $t)\" = 1 && go test -count=1 -run '^(TestRunPrintsDurableIDOnceBeforeTerminalOutcome|TestRunIDWriteFailureIsOperationalInterruption)$' -v ./cmd/partitur/ | grep -c '^--- PASS: TestRun' | grep -qx 2"]
          timeout_min: 30
        - id: interrupt-outcome-unchanged
          run: ["sh", "-c", "m=cmd/partitur/main.go; test \"$(grep -cF 'case driver.OutcomeInterrupted:' $m)\" = 1 && test \"$(grep -cF 'renderRunInterruption(stderr, result)' $m)\" = 1 && test -z \"$(git status --porcelain -- cmd/partitur/command_matrix_witness_test.go)\" && test \"$(grep -cF 'run interrupted: run_id=%q state=%q resume=%q detail=%q' $m)\" = 7"]
          timeout_min: 5
        - id: no-terminalization-vocabulary
