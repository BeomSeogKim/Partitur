goal: |
  Contain issue #463 axis (b), and nothing else. Today one unreadable run journal anywhere under
  `.partitur/runs/` takes down `partitur status` — and resume/answer/logs selection with it — for
  every other run in the repository, including runs whose journals are perfectly readable. A
  finished, failed run from four days ago makes the tool unusable for the live run.

  This run makes the `status` OBSERVATION scan skip a NON-SELECTED run it cannot project, and ships
  NOTHING else. Explicit selection of that same run must still halt with `ErrJournalCorrupt` and
  exit 5. Every decision- or mutation-adjacent selection — `answer`, `approve`, `amend`, `resume`,
  `cancel`, `apply`, and `logs` — keeps today's fail-closed scan, including its exit 5 when the only
  run's journal is unreadable. `internal/runstore` must stay byte-unchanged and fail-closed.

  This is ROUTE A, code-only. Axis (a) of #463 (no versioning / tolerance / migration for a
  superseded journal payload shape) is NOT in scope, and neither is #464. Do not add a journal
  compatibility path, do not relax `internal/runstate`'s field allowlist, do not add a status
  field, and do not touch the specification.

context: |
  ROUTING: THIS IS A CONFORMANCE FIX, NOT A SPECIFICATION CHANGE. READ THIS FIRST.

  Two normative anchors already decide this case, and today's code deviates from both.

  1. The exit-code table, docs/DESIGN.md:3851 (row for exit 2), lists among the exit-2 class:
     "missing or unreadable required input, UNREADABLE DISCOVERED INPUT, no active run, ...".
     A run directory that the global scan enumerated on its own — that nobody asked for — is
     discovered input, not required input.

  2. The pinned clause `status-exit.mapping-is-exhaustive` (docs/DESIGN.md:3571-3577,
     docs/DESIGN.clause-staging.json byte range 240559-240910) reads:

       "The status-specific exit mapping is exhaustive: 0 for a reported projection; 1 for usage;
        2 for a refused selection or required readable input, including no active run, a non-unique
        active-run set, or an unreadable pinned snapshot; and 5 only when THE PROJECTION cannot be
        built, including a corrupt journal prefix or an event the core cannot project."

     "the projection" is the projection `status` was asked to report — the selected run's. Run Y's
     journal being unprojectable is not run X's projection failing to build. Reporting run Y's
     corruption as "recovery halted" for run X is the deviation this run removes.

  So: DO NOT EDIT docs/DESIGN.md, docs/DESIGN.clause-staging.json, docs/ko/**, any ledger, or any
  recovery doc. No normative sentence changes. No field is added to the `status --json` schema
  block (docs/DESIGN.md:3466-3496) — that is #464's question and it is a spec question. If you come
  to believe this fix requires a DESIGN change, STOP and say so in your report rather than editing
  the specification.

  TAKE 1 FAILED EXACTLY HERE. READ THIS BEFORE YOU TOUCH THE SEAM.

  A previous attempt at this score put the containment inside `Read`'s scan loop, which EVERY
  command shares. Both writer attempts were otherwise VERIFIED and passed every criterion except
  `cmd-package`, which failed both times with exactly:

    --- FAIL: TestCommandMatrixWitnesses/ANSWER-003 — command_matrix_witness_test.go:1273: exit=2 stdout="", want unavailable-projection exit 5
    --- FAIL: TestCommandMatrixWitnesses/APPROVE-002 — command_matrix_witness_test.go:1348: exit=2 stdout="", want unavailable-projection exit 5
    --- FAIL: TestApproveTypeValidationFollowsSelection/unavailable_projection_precedes_operand_applicability — main_test.go:1051: exit=2 stdout="" stderr="precondition refused: detail=\"no active run: found 0\"\n"

  WHY. `answer` (cmd/partitur/main.go:954) and `approve` (main.go:793) select with
  `statusprojection.Read(root, "")` — the SAME empty-selector scan `status` uses. All three fixtures
  corrupt the single fixture run's journal and then invoke `answer`/`approve` with NO run operand.
  Containment inside the shared scan makes that run get skipped, the active set become empty, and
  the command refuse with `no active run` (exit 2) instead of reporting the unavailable projection
  (exit 5).

  THOSE TWO EXITS ARE NORMATIVE, NOT TEST HABIT. docs/DESIGN.md:3418, in the `partitur answer`
  precondition matrix:

    | `ANSWER-003` | acquired | no current projection can be built | not started | Report the unavailable projection and append nothing; exit 5 |

  and docs/DESIGN.md:3434, in the `partitur approve` precondition matrix:

    | `APPROVE-002` | no current projection can be built | not reached | not started | Report the unavailable projection and append nothing; exit 5 |

  Both rows are pinned clauses — markers `answer-matrix.ANSWER-003`
  (docs/DESIGN.clause-staging.json:12077) and `approve-matrix.APPROVE-002`
  (docs/DESIGN.clause-staging.json:12138). Keeping those two witnesses green is SPECIFICATION
  CONFORMANCE, not test appeasement. Turning either into exit 2 is a specification change this run
  may not make; if you come to believe it is required, STOP and report.

  THE SCOPING RULE — THE REQUIRED END STATE, STATED BEHAVIOURALLY.
    - The `status` OBSERVATION path, and only it, skips a discovered run it cannot project when NO
      run was selected. `partitur status` with no operand exits 0 and reports the readable active
      run even though an unreadable run sits beside it.
    - Every DECISION- or MUTATION-ADJACENT selection keeps today's behaviour, byte for byte, in
      stderr and exit code: `answer`, `approve`, `amend`, `resume`, `cancel`, `apply`, and `logs`.
      With the only run's journal unreadable they still report the unavailable projection and exit 5.
    - Explicit selection is unchanged everywhere, `status` included. STATUS-004 (`status run-1`),
