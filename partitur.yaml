          run: ["sh", "-c", "test -z \"$(git status --porcelain -- internal/status/status_test.go)\" && go test -count=1 -run '^(TestReadProjectsPinnedRunWithoutMutatingIt|TestProjectRendersPendingDecisions|TestProjectCarriesVerifiedProvenanceAndShippingRecovery)$' -v ./internal/status/ | grep -c '^--- PASS: Test' | grep -qx 3"]
          timeout_min: 20
        - id: schema-additivity
          run: ["sh", "-c", "for n in TestStatusJSONAndArgumentErrors TestStatusRendersProjectionAndClassifiesOutcomes; do grep -qF \"func $n(t *testing.T) {\" cmd/partitur/main_test.go || exit 1; done; go test -count=1 -run '^(TestStatusJSONAndArgumentErrors|TestStatusRendersProjectionAndClassifiesOutcomes)$' -v ./cmd/partitur/ | grep -c '^--- PASS: TestStatus' | grep -qx 2"]
          timeout_min: 30
        - id: status-package
          run: ["go", "test", "-count=1", "./internal/status/"]
          timeout_min: 25
        - id: cmd-package
          run: ["go", "test", "-count=1", "./cmd/partitur/"]
          timeout_min: 45
        - id: mutation-proof
          run: ["sh", "-c", "grep -qF 'func TestMutationBudgetDisclosureAssemblyIsLoadBearing(t *testing.T) {' internal/status/mutation_test.go && grep -qF 'TestStatusDisclosesOpenExecutionInterval' internal/status/mutation_test.go && go test -tags=mutation -count=1 -run '^TestMutationBudgetDisclosureAssemblyIsLoadBearing$' -v ./internal/status/ | grep -q '^--- PASS: TestMutationBudgetDisclosureAssemblyIsLoadBearing'"]
          timeout_min: 30
        - id: change-scope
          run: ["sh", "-c", "test -z \"$(git status --porcelain -- internal/ | grep -v 'internal/status/')\" && test -z \"$(git status --porcelain -- internal/status/ | grep -vE 'internal/status/(status\\.go|budget_disclosure_test\\.go|mutation_test\\.go)$')\" && test -z \"$(git status --porcelain -- cmd/ | grep -vE 'cmd/partitur/status_budget_disclosure_test\\.go$')\" && test -z \"$(git status --porcelain -- docs/ integration/ .github/ go.mod go.sum partitur.yaml .partitur/ DESIGN.md AGENTS.md)\""]
          timeout_min: 5
      human_gate: always

policy:
  allowed_paths:
    - "internal/status/status.go"
    - "internal/status/budget_disclosure_test.go"
    - "internal/status/mutation_test.go"
    - "cmd/partitur/status_budget_disclosure_test.go"
  side_effects: []
  budget:
    active_wall_clock_min: 150
    retries_per_movement: 1
  amendment:
    auto: "off"
