score: "0.2"
name: issue-316-execute-cancellation-liveness-bound
revision: 1
status: finalized

goal: |
  Fix issue #316 at the layer this run owns: the three wall-clock-bounded cancellation tests in
  `internal/adapter/execute_test.go` are pinned at `2*time.Second`, which under the mutation
  gate's own load measures the scheduler rather than the cancellation path. Replace the three
  literals with one shared, named liveness bound of `6 * time.Second`, and add a guard test that
  keeps that bound strictly inside the window where it still proves something.

context: |
  THE DEFECT, LOCATED.

  `internal/adapter/execute_test.go` has a helper at line ~994:

      // executeWithin bounds Execute so that losing the cancellation deadline fails this test
      // by name instead of hanging the package. The guards under test are deadlines: deleting
      // one makes the call wait forever, and a package-level timeout hides which test broke.
      func executeWithin(t *testing.T, client *Client, plan ExecutePlan, limit time.Duration) (ExecuteReport, error)

  Thirteen call sites pass a limit. Ten pass `30*time.Second`. Three pass `2*time.Second`:

      execute_test.go:575   TestExecuteCancelAfterEOFStillArmsTheGrace       (line 527)
      execute_test.go:673   TestExecuteCancellationDuringLaunchEndsTheCall   (line 649)
      execute_test.go:889   TestExecuteCancellationBoundsBlockedRequestWrites (line 834)

  Those three are exactly the tests issue #316 reports red under `go test -tags=mutation ./...`,
  with the failure text produced by `executeWithin`'s own `t.Fatalf`:

      execute_test.go:573: Execute did not return within 2s: the cancellation deadline is not bounding this window

  MEASURED, AND RECORDED ON THE ISSUE — do not re-derive this, and do not contradict it without
  a measurement of your own.

    - Same machine, same tag, same commit, back to back:
      `go test -tags=mutation -count=1 -timeout=20m ./internal/adapter/` — ok, 30.4s.
      `go test -tags=mutation -count=1 -timeout=40m ./...`              — FAIL, 106.0s for the
      same package. 3.5x, and only the alongside run misses the 2-second bounds.
    - The overrun subtests land at 2.23s-2.59s; the parent tests at 4.59s-4.92s.
    - The same tests in isolation are 3/3 green, and CI's ubuntu mutation job is green.
    - Sampled during a starved run on a 12-core machine: load average 17-27, 7-10 concurrent
      `go` processes, 11-17 concurrent test binaries.

  So the bound is not measuring the cancellation path under load; it is measuring the scheduler.

  THE AGREED FIX (design gate, two parties, 2026-09-10 — implement it, do not redesign it).

  One shared named constant in `internal/adapter/execute_test.go`, replacing all three literals:

      // Must remain strictly greater than the injected 20ms cancellation grace
      // and strictly less than incidentalTestDeadline so the launch-watcher
      // oracle cannot be satisfied by the client's own deadline.
      const executeCancellationLivenessBound = 6 * time.Second

  6s was chosen over 8s under an upper-margin challenge: it is ~1.30x the conservatively read
  4.6s worst observation above, and it leaves 4s of separation from the 10s ceiling instead of 2s.

  WHY THE BOUND IS TWO-SIDED, PER SITE. This is the part a naive "just raise the number" change
  gets wrong, and it is what the new guard test exists to hold.

    - At :575 and :889 the client's 10s deadline timer is stopped at the `probed:` label
      (`internal/adapter/execute.go:247-253`), and both tests assert
      `strings.Contains(err, "cancel completion grace expired")`. The client deadline cannot
      satisfy those oracles.
    - At :673 the launch runs under `context.WithDeadline` (`execute.go:58-75`), so the client's
      10s deadline IS live, and the test asserts only `err != nil`. That is the one genuine
      tautology race, and the existing comment at :671-672 says so:
      "Bounded well below the client's own 10s deadline: without the launch watcher that
      deadline is what ends the call, and the test would pass for the wrong reason."
      A bound at or above `incidentalTestDeadline` turns that test into a tautology.
    - The lower side: every one of these clients is built with a 20ms cancellation grace
      (`newClient(..., incidentalTestDeadline, 20*time.Millisecond)`), so a bound at or below
      20ms would fail before the mechanism under test can run at all.

  WHAT MUST NOT MOVE.

    - `incidentalTestDeadline = 10 * time.Second` (`internal/adapter/client_test.go:42`) has 35
      usages across the package and `fixtureOwnerReapTimeout = incidentalTestDeadline / 2`
      (`client_test.go:47`) is derived from it. NEITHER may be touched by this change.
    - No `-p` may be added to any gate. `.github/workflows/go.yml` currently passes `-p` nowhere,
      and issue #316's own direction 2 is a separate, larger decision with a separate PR; this
      repository's lesson is that `-p 1` is not how CI runs, so a bound added here would make the
      local gate diverge from the gate that actually guards `main`.
    - No production (non-test) file changes. This defect is entirely in the test bound.

  THE MUTATION PROOF, AND ONE REFINEMENT THE DESIGN GATE COULD NOT SEE.

  `internal/adapter` has NO mutation-tagged suite today (`grep -rl 'go:build mutation'` lists 30
  files; none is in `internal/adapter`). The convention for adding one is fixed and small — see
  `internal/launch/mutation_test.go` (138 lines, two mutations plus one copy helper): copy the
  repository into `t.TempDir()` skipping `.git` and `.partitur`, assert the anchor string occurs
  exactly once, rewrite it, re-read to confirm the rewrite applied, then drive the child through
  `internal/mutationtest`:

      result := mutationtest.Run(ctx, mutationtest.Child{
          Dir: copyRoot, Package: "./internal/adapter",
          TestPattern: "<name>", TestNames: []string{"<name>"},
          Environment: environment.ChildEnvironment(os.Environ(), "PARTITUR_MUTATION_CHILD=1"),
      })
      if result.Outcome != mutationtest.Killed { t.Fatalf(...) }

  Because the copy is a throwaway, the mutation is self-restoring: this working tree is never
  written to.

  THE REFINEMENT: the design gate asked for the mutation (bound -> `incidentalTestDeadline`) to
  kill BOTH the guard test AND `TestExecuteCancellationDuringLaunchEndsTheCall`. It kills only the
  guard test, and that is a property of the fix, not a gap in it. With the launch watcher intact,
  `TestExecuteCancellationDuringLaunchEndsTheCall` returns in milliseconds and passes at ANY
  limit; the mutation makes it tautological, not red. `internal/mutationtest`'s classifier
  (`child.go:190-205`) only reports `Killed` when EVERY targeted test failed, so naming both tests
  as targets would report "mixed outcomes" and the criterion could never pass. The mutation
  criterion below therefore targets the guard test alone — which is precisely why the design gate
  required the guard test to exist. The writer still runs the launch test in the mutated copy and
  reports what it does, so the tautology is recorded rather than assumed.

  WHAT IS NOT IN THIS RUN.

  The design gate's fifth criterion — "run the three tests under the documented 3.5x starvation
  control; main is red, 6s must pass" — is a MEASUREMENT, not a deterministic assertion. No
  portable starvation generator exists in this package (verified: no GOMAXPROCS or load-control
  precedent anywhere in `internal/adapter`'s tests), and a criterion that manufactured load would
  be flaky in exactly the way this issue is about. It is discharged after apply, by the
  full-battery comparison, not here. Do not attempt to build one.

  This score temporarily replaces the committed reference-workflow score because `partitur run`
  reads only `<repo>/partitur.yaml` and takes no score operand (#435). It is reverted before the
  pull request; only the `internal/adapter/` change is meant to land.

verification:
  expectation:
    intent: pass-existing-tests
    apply_gate:
      require: [verified, approved]
  final_movement: confirm

