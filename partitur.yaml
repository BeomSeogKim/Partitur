  THE SEAM, LOCATED ON THIS TREE. Confirm each anchor in step 0 before editing.

  SEAM — the global scan, internal/status/status.go:183-199, inside `Read`:

      ids, err := store.RunIDs()
      ...
      for _, id := range ids {
          report, err := readRun(store, id)
          if errors.Is(err, ErrRunNotFound) {
              continue
          }
          if err != nil {
              return Report{}, err          // <-- one bad journal aborts the whole scan
          }
          if !terminal(report.Run.Lifecycle) {
              active = append(active, report)
          }
      }

  Only `ErrRunNotFound` is tolerated. Add exactly one more tolerated class: a discovered run whose
  PROJECTION cannot be built. Classify it with a helper whose name and signature this score pins,
  because the mutation proof anchors on it:

      func unreadableDiscovered(err error) bool

  It must return true for exactly `runstore.ErrJournalCorrupt` and `runstate.ErrUnsupportedEventType`
  — the same two classes `cmd/partitur/main.go`'s `unavailableProjection` (main.go:1325-1327) already
  names as "no projection can be built". Both packages are already imported by status.go. Use it in
  the scan loop only, and — per the scoping rule above — only when the caller asked for the
  OBSERVATION scan, with the gate as an ENCLOSING condition so the pinned literal stays intact:

      if err != nil {
          if <observation scan requested> {
              if unreadableDiscovered(err) {
                  continue
              }
          }
          return Report{}, err
      }

  WHY THAT PREDICATE AND NOT "any error". Three classes must KEEP aborting the scan, because they
  are not "the projection cannot be built":
    - `ErrSnapshot` / `ErrSnapshotInvalid` — an unreadable pinned snapshot is named in the clause
      above as an exit-2 refusal of the whole observation. A test pins that it still aborts.
    - `ErrRequiredInput` — permission errors, unreadable store root.
    - anything unclassified — the default arm stays.
  `ErrRunNotFound` keeps its existing `continue`. Do not merge the two branches.

  WHERE THE REJECTION ACTUALLY HAPPENS (do not re-derive this; it decides the fixture). The legacy
  `execution.stopped` payload is rejected by `runstate.ValidateEvent` inside
  `internal/runstore/journal.go`'s `validateEnvelope` (journal.go:414-418), reached from
  `decodeEvent`, reached from `ReadJournal` — which wraps it as
  `fmt.Errorf("%w: %v", ErrJournalCorrupt, err)` (journal.go:228). The message is verbatim
  `journal_corrupt: invalid event: execution.stopped: unknown field "observed_at"`, with no `seq=`
  prefix, exactly as #463 reports it. In `internal/status`, `readRun` reaches it through
  `loadInitialScore` -> `store.LoadInitialScore` -> `ReadJournal`, and status.go:243 already returns
  `ErrJournalCorrupt` unwrapped rather than re-classing it as `ErrSnapshot`. So the error your new
  branch sees IS `runstore.ErrJournalCorrupt`. The field allowlist that rejects it is
  internal/runstate/apply.go:2186-2188 — DO NOT WIDEN IT.

  THE SCAN CANNOT FILTER BY TERMINALITY. Both offending runs in #463 are terminal (`run.failed`),
  but `ReadJournal` fails at the bad line before any event is returned, so the scan cannot know a
  run is terminal without first reading it. Containment must therefore be by ERROR CLASS, not by
  skipping terminal runs. Do not add a terminal-state pre-filter to `store.RunIDs()`.

  WHAT THIS FIX DELIBERATELY DOES NOT DO — the over-correction list. A change that does any of
  these is wrong even if every test passes:
    - It must NOT make `status.Read(root, "<that-run-id>")` tolerant. Explicit selection of an
      unreadable run still returns `ErrJournalCorrupt` and `statusErrorCode` still maps it to 5.
      That path (status.go:176-181) is not touched at all.
    - It must NOT relax `internal/runstore` or `internal/runstate` reading. `internal/runstore` stays
      BYTE-UNCHANGED; a criterion enforces it. `apply`'s independent mutual-exclusion scan at
      internal/runstore/application.go:286-299 calls `store.LoadRunInput(id)` and returns the error
      — a run it cannot read CANNOT be proven inactive, so `apply` must keep refusing. The asymmetry
      is intentional and is the whole safety argument: `status` is observational and must contain;
      `apply` is a mutation precondition and must stay fail-closed.
    - It must NOT print, log, or add a field for the skipped run. No new stderr line, no schema
      change, no `Report` field. (Whether the skip should be surfaced is an open steering question,
      NOT something to decide here.)
    - It must NOT change any exit code, any render string, or any command-matrix witness.
      cmd/partitur/command_matrix_witness_test.go and cmd/partitur/main_test.go are FROZEN — a
      criterion requires them byte-unchanged. STATUS-004 (explicit selection of a corrupt journal,
      exit 5) and `TestStatusUnprojectableJournalExitsFive` must pass UNMODIFIED. If you believe one
      of them must change, STOP and report; that would mean the fix leaked past its boundary.

  A CONSEQUENCE TO STATE, NOT TO FIX. After the skip, a run that could not be read is no longer
  counted when `Read` decides the active set is unique (status.go:200-202). If such a run were in
  fact active, the scan now reports a unique active run where before it refused. That is accepted
  for Route A — an unreadable run cannot be projected as active either way, and the alternative
