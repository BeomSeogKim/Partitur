      `internal/recoveryexec/`, `internal/recovery/`, `internal/runstate/`, `internal/runstore/`,
      to `DESIGN.md`, to `docs/`, to `partitur.yaml` or to `.partitur/cast.yaml` is a scope
      violation and a failure — say so rather than passing it.

      2. NO CLOCK, NO DERIVED JUDGEMENT. This is the fence that matters most, because a clock in a
      status read would be invisible in a passing test suite and would violate `DESIGN.md:3439`
      and `DESIGN.md:2321`. Confirm by reading `internal/status/status.go` in full that it
      contains no `time.Now`, does not import `"time"`, emits no `observed_at`, and computes no
      derived value — every field of `Budget` and `OpenExecution` must be a plain copy from
      `replay.State`, with no arithmetic, no comparison against a limit, and no boolean such as
