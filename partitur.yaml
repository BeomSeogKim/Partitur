      1. SCOPE, BY READING THE WHOLE DIFF. Run `git status --porcelain` and `git diff --stat` and
      report both verbatim, then READ `git diff` in full — not a summary of it. At most four
      paths may appear: `internal/status/status.go` (modified),
      `internal/status/budget_disclosure_test.go` (new), `internal/status/mutation_test.go`
      (modified), and `cmd/partitur/status_budget_disclosure_test.go` (new). A change to
