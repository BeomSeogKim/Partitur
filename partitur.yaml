      Confirm the scenario is DETERMINISTIC: the backdating margin must be large enough that the
      cap saturates on any machine, with no sleep and no signal. Three hours of elapsed wall clock
      against 9,000,000 ms of remaining budget leaves 1.8 million milliseconds of slack; a margin
