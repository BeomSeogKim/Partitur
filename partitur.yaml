    {"event_id":"eae0817fd0427dc951e4d9c2edac15e5","seq":48,"ts":"2026-09-09T11:35:37.138Z","run_id":"01a08513-603e-7b0a-9d18-4d95ee790f97","score_revision":1,"type":"execution.stopped","causation_id":"a26cbf0304893d0dda4c69c1d0653c5a","payload":{"charged_duration":9000000,"charging":"clamped","interval_id":"01a08513-60dd-78ce-a481-f973e3e78b5d","observed_at":"2026-09-09T11:35:37.135Z","reason":"recovered"}}

