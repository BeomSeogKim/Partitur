score: "0.2"
name: kill-order-approver-first
revision: 1
status: finalized

goal: |
  Fix issue #471, and nothing else. In
  `cmd/partitur/prepare_quiesce_harness_test.go`, the
  `TestHumanApprovalPreparedToObservedKillCuts/prepare.prepared_to_observed/observed` fixture kills
  AND REAPS the prepared driver before it kills the released human approver. The approver is a live
  production `approve` process that, past its `amendment.approval_prepared` receipt, polls
  `CompleteOrAbandonPrepare` every 25ms. In the window between the driver's reap and the approver's
  kill, that poll sees the prepare as fenced, sweeps it, and durably appends `amendment.approved`.
  The pending prepare is then gone, the ordinary mutation at `:233` is ACCEPTED, and
  `assertPrepareBarrier` fails with:

    prepare_quiesce_harness_test.go:233: ordinary mutation while prepare is pending = <nil>,
    want prepare_pending refusal

  This run applies FIX DIRECTION (1) from the issue: SWAP the two statements so the approver is dead
  before the driver is reaped. That is TWO LINES OF TEST CODE in ONE FILE. Nothing else ships.

  FORBIDDEN in this run, even if it would pass every test: any change to production code, to the
  faultpoint catalogue, to `docs/DESIGN.md` or any other specification or ledger document, to the
  registered kill-harness record name, to the subtest name, to the sibling cross-edge tests, or to
  any assertion. No retries, no `t.Eventually`-style polling, no loosened assertion, no new
  faultpoint. Fix direction (2) (an event-gated kill via a new faultpoint) is REJECTED for now
  because the catalogue is locked.

context: |
  ROUTING: THIS IS A TEST-ONLY ORDERING FIX. IT IS NOT A PRODUCTION DEFECT AND NOT A SPEC CHANGE.

  The production behaviour under test is CORRECT and must not move. A live approver that finds its
  prepare fenced is SUPPOSED to sweep and approve it — that is the recovery contract
  (`internal/runstore/prepare.go:288-291`, driven from
  `internal/amendmentexec/dispositioner.go:121`). The defect is that the TEST arranges for exactly
  that legitimate production path to run inside the window it wants to observe. The test asks "is
  the prepare still pending after both processes die?" while leaving one of the two processes alive
  and working. Fixing production code here would be fixing the wrong thing. If you come to believe
  a production change is required, STOP and say so in your report rather than editing anything
  outside the one test file.

  THE SEAM, LOCATED ON THIS TREE (confirm in step 0 before editing).
  `cmd/partitur/prepare_quiesce_harness_test.go:223-235`:

      t.Run("prepare.prepared_to_observed/observed", func(t *testing.T) {
          repository, environment, runID, driver, approver := preparedHumanApproval(...)
          defer driver.stop(t)
          defer approver.stop(t)
          releasePausedReceipt(t, approver)          // :227 — approver becomes a live poller
          driver.releaseProbe(t)
          driver.waitReceipt(t, "prepare.quiesce_observed")
          assertQuiesceRound(t, repository, runID, 1)
          driver.kill(t)                             // :231 — kills AND Waits() the driver
          killPausedRun(t, approver)                 // :232 — kills AND Waits() the approver
          assertPrepareBarrier(t, repository, runID) // :233 — the failing assertion
          assertRecoveryFixedPoint(...)
      })

  THE REQUIRED END STATE, STATED EXACTLY. Lines :231 and :232 are SWAPPED, so the block reads:

          assertQuiesceRound(t, repository, runID, 1)
          killPausedRun(t, approver)
          driver.kill(t)
          assertPrepareBarrier(t, repository, runID)

  and NOTHING ELSE in the file changes. Both helpers kill and then `Wait()` their process
  (`killPausedRun`, cmd/partitur/routed_proposal_kill_harness_test.go:85-95;
  `(*preparedLiveRun).kill`, prepare_quiesce_harness_test.go:521-535), so after the swap the
  approver is REAPED — not merely signalled — before the driver's own reap opens the fence window.
  There is no live poller left to take it.

  WHY THE SWAP IS SUFFICIENT, AND WHY IT DOES NOT INVERT THE FLAKE. The race needs a live approver
  AND a dead-and-reaped driver at the same time. The approver only reaches the fence path because
  the driver's lease is gone. Killing the approver first removes the only process that could take
  the fence path, and the driver — which never polls `CompleteOrAbandonPrepare` — cannot approve
  anything while the approver dies. The dependency is one-directional, so the swapped order has no
  symmetric hazard.

  THE PRECEDENT. `cmd/partitur/supersession_kill_matrix_test.go:359-500`
  (`killLiveApproverAtSupersessionEndpoint` / `killSupersessionCommandAtEndpoint`) is the pattern
  this repository already treats as correct: the live approver is killed at a NAMED endpoint and is
  dead before the driver is touched. The swap brings the human-approval observed cut into line with
  it. Read that function before editing so you can say in your report that the orders now agree.

  WHAT THE CATALOGUE EXPECTS, AND WHY THE NAME MAY NOT MOVE. The observed cut is a REGISTERED kill
  record: `cmd/partitur/kill_harness_test.go:640` defines
  `humanApprovalFixture = "TestHumanApprovalPreparedToObservedKillCuts/"` and :655 registers

      {faultpoint.EdgePreparePreparedToObserved, killEndpointRight,
       humanApprovalFixture + "prepare.prepared_to_observed/observed"},

  which `TestKillHarnessCatalogCrossCheck` (kill_harness_test.go:396) and `TestE2CatalogCountClaims`
  (:457) reconcile against Appendix E via `receiptKillHarnessRecords`. The harness re-runs this test
  in a subprocess filtered by
  `^(TestPrepareQuiesceDriverKillCuts|TestHumanApprovalPreparedToObservedKillCuts)$`
  (kill_harness_test.go:860) — which is the second CI draw the issue mentions. RENAMING the test
  function or the subtest would silently UNDISCHARGE a catalogue record. Do not rename either. A
  criterion greps both the registration line and the `t.Run` line.

  DO NOT TOUCH THE SIBLINGS. `cmd/partitur/cross_edge_pending_prepare_test.go:84-85` and
  `cmd/partitur/cross_edge_cancellation_test.go:197-198` use the SAME driver-first order. They are
  safe TODAY only because their approver is still paused at its receipt and therefore still holds
  the state lock — they are one `releasePausedReceipt` away from the same flake. That is a real
  latent hazard and it is DELIBERATELY OUT OF SCOPE for this run: a fence criterion requires both
  files byte-unchanged. Name the hazard in your report; do not fix it here.

  MEASURED BASELINE, AND WHAT THE STRESS CRITERION CAN AND CANNOT PROVE. READ THIS.
  The issue's repro is 3/50 failures with `-count=50`, `GOMAXPROCS=1`, `nice -n 19`, and 20 CPU
  burners on macOS arm64; 30/30 pass unloaded; the control
  (`TestCrossEdgePrepareCheckProductionSubprocess`, whose approver is never released) passes 50/50
  under identical load. The full 50-iteration pass measured ~287s.

  The `flaky-test-stress` criterion below runs `-count=50` under `GOMAXPROCS=1` but WITHOUT external
  burners, because acceptance runs in a sandbox where spawning 20 competing processes is neither
  reproducible nor polite. It is therefore CONFIRMATORY, NOT PROBATIVE: at 3/50 under load and 0/30
  unloaded, a green 50-run without burners is weak evidence on its own and you must NOT report it as
  "the flake is fixed". THE STRUCTURAL PROOF IS `kill-order-swapped`, which reads the source and
  asserts the ordering directly. Say exactly this in your report: the stress run is a regression
  fence; the ordering criterion is the lock.

  NO MUTATION PROOF IS REQUIRED, AND NONE MAY BE ADDED. This run's change is a two-line reordering
  of two statements inside one test. There is no predicate to mutate, no branch to invert, and
  `internal/**` is frozen, so the usual "prove the change is load-bearing by mutation" step does not
  apply and adding a `-tags=mutation` test would itself be an out-of-scope file change. The
  load-bearing evidence for this run is, in order: (a) `kill-order-swapped` reads the shipped source
  and fails unless the approver kill precedes the driver kill inside this exact subtest — VERIFIED
  to red on unfixed main and green on the swap; (b) `flaky-test-stress`; (c)
  `catalogue-record-still-discharged`. VERIFIER: do not demand a mutation criterion; its absence is
  a deliberate, stated exemption, not an oversight.

  RED-FIRST HONESTY. Only ONE criterion reds on unfixed main: `kill-order-swapped`. Everything else
  — build, vet, the full faultprobe suite, the catalogue discharge, and every fence — is GREEN on an
  untouched tree and its job is to STAY green. The `flaky-test-stress` criterion may well be green
  on unfixed main too (the flake is ~6% under load and ~0% unloaded); that is expected and is
  precisely why it is labelled confirmatory. Do not claim the stress criterion reproduced the flake
  unless you actually saw it fail, and quote the failure verbatim if you did.

  SCORE PLACEMENT. This score temporarily replaces the committed reference-workflow score because
  `partitur run` reads only `<repo>/partitur.yaml` and takes no score operand (#435). It, and the
  cast commit that precedes it, are reverted before the pull request; only the two-line change to
  `cmd/partitur/prepare_quiesce_harness_test.go` is meant to land.

verification:
  expectation:
    intent: pass-existing-tests
    apply_gate:
      require: [verified, approved]
  final_movement: confirm

