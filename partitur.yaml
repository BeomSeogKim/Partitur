score: "0.2"
name: issue-442i-disclose-the-budget-in-status-json
revision: 1
status: finalized

goal: |
  Ship option C of issue #442(i): an additive `budget` object in `partitur status --json`.

  Today the run's budget position is durable in the journal and projected into `replay.State`,
  but no read-only surface exposes it. An operator whose run was clamped on resume cannot see
  how much budget was consumed, nor that an execution interval is still open, without reading
  the journal by hand. This run copies two already-projected values onto the status report:
  `budget.consumed_budget_ms`, and `budget.open_execution` which is either null or the four
  fields of the open interval.

  Nothing else changes. No clock is sampled, no `observed_at` is emitted, no exhaustion boolean
  is inferred, no charging arithmetic moves, no resume path is touched, and the human `status`
  text output gains not one byte.

context: |
  WHAT WAS DECIDED, AND WHAT WAS DECIDED AGAINST. READ THIS BEFORE YOU DESIGN ANYTHING.

  Issue #442's literal ask is "report the clamp and refuse with an explanation". A two-party
  design gate on 2026-09-11 (codex writer, opus verifier, two rounds) established that no single
  change ships that whole ask, and split it three ways:

    - OPTION A, refusing BEFORE the charge is committed, is NORMATIVELY BLOCKED. `DESIGN.md`
      6582-6588 makes the interval close mandatory; 3729-3743 is the resume matrix including
      RESUME-002; 6620-6625 says a matrix row "selects an action, never an outcome". A refusal
      before charging would require a new resume flag, and `parseResumeArgs`
      (`cmd/partitur/main.go:990-998`) takes none — the usage pin is `main.go:374`. Option A
      stays OPEN as an owner question. Do NOT implement it.

    - OPTION B, a terminal diagnostic on resume's stderr, is ISSUE #455 and is OUT OF SCOPE
      HERE. It is genuinely larger than it looks: it must cover all five resume-reachable clamp
      routes or it under-reports silently, and the naive accumulator is unsound because
      `internal/runstore/journal.go:285-298` returns existing receipts on idempotent replay.

    - OPTION C, this run, is the additive `status --json` disclosure. It is size S and ungated.

  Shipping C must NOT be recorded as implementing refusal-before-charge. If you believe A or B
  belongs here, STOP and say so in your report; do not write it.

  THE SEAM, LOCATED.

  `internal/status/status.go:279-280` binds the replayed state:

      func projectAt(runID runstate.RunID, compiled *score.Score, snapshots map[uint64]*score.Score, replay runstore.ReadReplayResult, repositoryRoot string) Report {
          state := replay.State

  and assembles `Report` immediately below it (`status.go:281-296`). Both values you need are
  already on `state` and need no computation:

    - `state.ConsumedBudgetMS` (`internal/runstate/types.go:406`). Its only producer is
      `internal/runstate/apply.go:715`, `state.ConsumedBudgetMS += mustInt(payload, "charged_duration")`
      on every `execution.stopped`. It is a pure projection of the journal.

    - `state.OpenExecution` (`internal/runstate/types.go:405`), a `*runstate.ExecutionInterval`
      declared at `internal/runstate/types.go:210-215`:

          type ExecutionInterval struct {
              ID               IntervalID
              Phase            string
              WallStart        string
              RemainingAtStart int64
          }

      Set on `execution.started` (`apply.go:700-709`), cleared on `execution.stopped`
      (`apply.go:710-716`). Nil exactly when no interval is open.

  NOTE THE FIELD-NAME DRIFT AND DO NOT PROPAGATE IT. The Go field is `RemainingAtStart` with no
  `MS` suffix; the journal payload key is `remaining_at_start`; the JSON key this run introduces
  is `remaining_at_start_ms`, matching the `_ms` convention already used by
  `consumed_budget_ms`. Do not rename the runstate field, and do not rename the journal key.

  THE AGREED DESIGN (implement it, do not redesign it).

  1. Two new types in `internal/status/status.go`, beside the other report types:

         type Budget struct {
             ConsumedBudgetMS int64          `json:"consumed_budget_ms"`
             OpenExecution    *OpenExecution `json:"open_execution"`
         }

         type OpenExecution struct {
             IntervalID         string `json:"interval_id"`
             Phase              string `json:"phase"`
             WallStart          string `json:"wall_start"`
             RemainingAtStartMS int64  `json:"remaining_at_start_ms"`
         }

     `OpenExecution` is a POINTER on `Budget` so that a closed interval encodes as JSON `null`
     rather than as a zero-valued object. A zero-valued object would be indistinguishable from
     an interval that genuinely started at the epoch with zero remaining budget.

  2. One new field on `Report` (`status.go:44-52`), appended LAST so the encoded key order of
     every existing field is unchanged:

         Budget Budget `json:"budget"`

  3. One new assembly line inside the `Report` literal in `projectAt`, and one small helper:

         func budgetProjection(state runstate.State) Budget {
             projection := Budget{ConsumedBudgetMS: state.ConsumedBudgetMS}
             if state.OpenExecution != nil {
                 projection.OpenExecution = &OpenExecution{
                     IntervalID:         string(state.OpenExecution.ID),
                     Phase:              state.OpenExecution.Phase,
                     WallStart:          state.OpenExecution.WallStart,
                     RemainingAtStartMS: state.OpenExecution.RemainingAtStart,
                 }
             }
             return projection
         }

     Every field is a COPY. No arithmetic, no comparison against a limit, no derived boolean.

  4. THE SCHEMA VERSION DOES NOT CHANGE. It stays `partitur/status+json;v=1` (`status.go:282`).
     The status schema is explicitly additive: adding a key is not a breaking change, and the
     one existing `--json` consumer test decodes into the struct rather than byte-comparing
     (`cmd/partitur/main_test.go:349-367`, `TestStatusJSONAndArgumentErrors`, which unmarshals
     and checks two fields). Verified on this tree: no test anywhere byte-compares status JSON.

  WHY THERE IS NO CLOCK IN THIS CHANGE, AND WHY THAT IS THE POINT.

  `DESIGN.md:3439` confines status to the journal plus pinned snapshots. `DESIGN.md:2321` reserves
  `observed_at` to the closing process — the process that actually closes an interval is the only
  one entitled to say when it observed the world. A status read is not that process.

  So this change must NOT:
    - call `time.Now()` or import `"time"` in `internal/status/status.go`,
    - emit an `observed_at`, an `elapsed_ms`, or a `remaining_ms`,
    - infer `exhausted: true`, `over_budget: true`, or any comparable boolean.

  A reader who wants elapsed time takes their own clock sample and subtracts `wall_start`. That
  subtraction is the reader's, and its provenance stays visible. `internal/status/status.go`
  imports no `"time"` today (`status.go:4-21`) and must still import none afterwards. One
  acceptance criterion enforces that mechanically.

  WHAT THIS RUN MUST NOT TOUCH.

    - THE HUMAN RENDERER. The consensus specifies the JSON surface ONLY. `renderStatusProjection`
      (`cmd/partitur/main.go:1360-1425`) gains no line. This keeps the change additive and
      pin-safe, because the human output is pinned by substring in
      `TestStatusRendersProjectionAndClassifiesOutcomes` (`main_test.go:274-298`) and byte-exactly
      in several command-matrix witnesses. The criterion is blunt and deliberate:
      `cmd/partitur/main.go` must be BYTE-UNCHANGED, and the only path that may appear under
      `cmd/` at all is the ONE NEW test file named below.

    - THE FOUR SILENCE LOCKS. The design gate identified four byte-exact assertions that pin
      resume's current output, and parameterizing them is what option B (#455) will have to do:

          cmd/partitur/main_test.go:1253                 TestResumeMapsOnlyExecutorOutcomesAndNeverWritesStdout
          cmd/partitur/main_test.go:1809                 TestResumeKeepsTerminalWriterScoreIdempotent
          cmd/partitur/main_test.go:1854                 TestResumeTreatsTerminalProjectionIdempotently
          cmd/partitur/command_matrix_witness_test.go:2601  witnessTerminalResumeCleanup (assertion at :2636)

      Option C touches no resume path, so these must be BYTE-UNCHANGED. This repository's lesson
      L40 is that a loosened assertion loses its lock; the safest handling of a lock you have no
      business touching is not to touch it. A criterion proves both files are unmodified.

    - THE CLAMP. `internal/recoveryexec/handlers.go:902-926` (`closeOpenExecutionInterval`) does
      the clamp arithmetic: `duration = observed - wall_start`, floored at 0, then capped at
      `interval.RemainingAtStart`, appended as `charging: "clamped"`. Not one character of it
      changes. Disclosure is a read; charging is a write; they must stay separated.

    - `DESIGN.md`, `docs/`, `internal/docclause/`, `partitur.yaml`, `.partitur/cast.yaml`,
      `internal/runstate/`, `internal/runstore/`, `internal/recoveryexec/`, and every other
      package. The ONLY paths this run may modify are listed under `policy.allowed_paths`.

  WHERE THE TESTS GO, AND WHY THERE.

  The existing status projection tests live in `internal/status/status_test.go` (package
  `status`), built on `statusFixture` (`status_test.go:474-502`), which creates a `t.TempDir()`
  repository, writes a real compiled score snapshot to
  `.partitur/runs/run-1/scores/revision-1.yaml`, opens a real `runstore.Store`, and appends a
  real `run.started` through `store.Mutate` / `transaction.At(...).Append(...)`. `runStartedPayload`
  (`status_test.go:504-517`) computes the real semantic and file hashes, which matters because
  `status.Read` loads and validates that snapshot (`status.go:188-196`, `loadInitialScore`).

  Put the three PROJECTION tests in ONE NEW FILE, `internal/status/budget_disclosure_test.go`,
  package `status`. It may freely call `statusFixture`, `statusScore`, `runStartedPayload` and
  `mustCompile` — same package, no export needed. Putting them in a new file rather than in
  `status_test.go` gives a free extra lock: `status_test.go` itself stays byte-unchanged, and a
  criterion proves it.

  THE FOURTH TEST CANNOT LIVE THERE, AND HERE IS EXACTLY WHY. `statusFixture` writes the score
  snapshot with a plain `os.WriteFile` (`status_test.go:481`) and writes no resolved cast at all.
  A real resume goes through `store.LoadRunInput`, which reads the PUBLISHED immutables
  `scores/revision-1.yaml` and `resolved-cast.yaml`. `statusFixture` publishes neither, so the
  recovery executor cannot load a run from it. `statusFixture` is a projection fixture, not a
  runnable one. Do not try to upgrade it — that would modify `status_test.go`, which a criterion
  forbids.

  The runnable fixture is `resumeFixture` (`cmd/partitur/main_test.go:2206`), which delegates to
  `resumeFixtureWithInputsAtRepository` (`main_test.go:2221-2262`). That one does the three things
  a real resume needs: `PublishImmutable("scores/revision-1.yaml", ...)`,
  `PublishImmutable("resolved-cast.yaml", ...)`, and one appended `run.started` — over a real git
  repository built by `resumeFixtureRepository` (`main_test.go:2270`), which `git init`s, commits
  two tracked files, and returns the base commit and tree. Its score
  (`resumeScore`, `main_test.go:2509`) has no movements and a 10-minute budget.

  So the fourth test goes in a SECOND NEW FILE, `cmd/partitur/status_budget_disclosure_test.go`,
  package `main`. This is also the correct MIRROR: every existing test that asserts a clamped
  close after a real CLI invocation already lives in `cmd/partitur/`
  (`cancellation_kill_matrix_test.go:365-383`, `supersession_kill_matrix_test.go:705-713`,
  `e2e_test.go:202`). It calls `resumeFixture` and `statusprojection.Read` — both already
  available in that package — so `main_test.go` needs no edit whatsoever.

  HOW THE PLANNER REACHES THE CLOSE, AND THE CHEAP ROUTE THROUGH IT. There are two routes to
  `closeOpenExecutionInterval`:

    - The ADAPTER route. `internal/recovery/planner.go:704-716`: an attempt in `AttemptStarting`
      yields `CaseUnstartedAttempt` (RC-RESUME-013) / `ActionRecoverUnstartedAttempt` with
      `Steps: {StepStabilizeHandoff, StepCloseAdapterInterval, StepClassifyAndAppendFailure}`.
      This needs an attempt, and it needs `Observations.Handoff` to stay `HandoffSafe`.

    - THE CHEAP ROUTE, and the one to use. `internal/recovery/planner.go:583-585`:

          if state.OpenExecution != nil && state.OpenExecution.Phase != "adapter" {
              return action(CaseOpenExecution, ActionCloseOpenExecutionInterval, true)
          }

      `CaseOpenExecution` is RC-RESUME-001. It needs NO attempt, no adapter launch directory and
      no sweep observation — only an open interval whose `phase` is not `"adapter"`. Its handler
      is `closeOpenExecutionInterval` directly (registered in
      `defaultKindsWithExecutionDependencies`, `internal/recoveryexec/handlers.go:82`), and it
      emits the IDENTICAL `reason: "recovered", charging: "clamped"` payload as the adapter route,
      through the same clamp arithmetic. Use `phase: "fixture"`, exactly as
      `appendCancellationFixtureInterval` does (`cmd/partitur/cancellation_fixture_test.go:504-513`).

      That branch sits after the stale-lease, cancellation, pending-prepare, human-gate and
      authority-reclaim branches (`planner.go:534-579`). A plain `resumeFixture(t, "")` journal
      grants no authority and holds no lease, so it drops straight through. Append NO
      `cancel.requested`: cancellation outranks this branch at `planner.go:560`.

  APPEND THE INTERVAL THROUGH THE STORE, NOT BY WRITING THE FILE. `recoveryconsequence.AppendEvent`
  (`internal/recoveryconsequence/consequence.go:733-741`) derives the `execution.stopped` event's
  `CausationID` from the event id of the matching `execution.started`. An interval that did not go
  through a real `store.Mutate` / `transaction.At(...).Append(...)` has no such id, and the close
  fails with "recovered interval source is absent". Follow the idiom at
  `cancellation_fixture_test.go:504-513`.

  ONE CONSEQUENCE TO EXPECT RATHER THAN BE SURPRISED BY. `apply.go:715` adds the full 9,000,000 ms
  to `ConsumedBudgetMS`, which is far beyond the fixture score's 600,000 ms budget, so the replan
  after RC-RESUME-001 will take a budget-exhaustion path. That is fine and it is deterministic —
  but it means you must not guess the resume's exit code. RECORD the exit code you actually
  observe, pin that value, and say in a comment what it means. Do not assert an exit code you
  reasoned your way to.

  HOW TO OPEN AN INTERVAL IN A FIXTURE. `execution.started` has NO attempt or movement
  precondition — `internal/runstate/apply.go:700-702` refuses it only when an interval is
  already open. Its required payload keys are exactly `interval_id`, `phase`, `wall_start`,
  `remaining_at_start` (`apply.go:1504-1505`), with `remaining_at_start` an integer
  (`apply.go:2168-2170`) that must be non-negative (`apply.go:2475-2478`). So appending
  `run.started` then `execution.started` is a valid two-event journal.

  `execution.stopped` requires `interval_id`, `reason`, `charging`, `charged_duration`, with
  `observed_at` OPTIONAL but required if and only if `charging == "clamped"`
  (`apply.go:1506-1507`, `apply.go:2479-2487`).

  THE BACKDATING TECHNIQUE IS ALREADY LIVE IN THIS REPOSITORY. It is at
  `internal/recoveryexec/executor_test.go:1196` inside
  `TestClampedCloseRefreshesBudgetBeforeFailureClassification` (declared at :1192):

      "interval_id": "last-millisecond", "phase": "adapter",
      "wall_start": time.Now().Add(-time.Second).UTC().Format(time.RFC3339Nano),
      "remaining_at_start": 1,

  Read it before you write anything. Note that the CLOCK LIVES IN THE TEST, not in the code
  under test — that is the shape you want here too.

  THE DETERMINISTIC SATURATION SCENARIO. Open an interval with

      "remaining_at_start": 9000000
      "wall_start":         time.Now().Add(-3 * time.Hour).UTC().Format(time.RFC3339Nano)

  Three hours is 10,800,000 ms of elapsed wall clock against 9,000,000 ms of remaining budget, so
  `closeOpenExecutionInterval` saturates its cap and charges EXACTLY 9,000,000 — the same integer
  on every machine, at any speed, with no sleep and no SIGTERM. The 1.8 million millisecond margin
  is what makes it deterministic; do not shrink it.

  DRIVING A REAL RESUME FROM A TEST. `partitur resume` reaches recovery through
  `executeRecovery` (`cmd/partitur/main.go:1204-1229`), which builds
  `productionRecoveryExecutor` (`main.go:154-160`) and calls the EXPORTED
  `(*recoveryexec.Executor).Execute(ctx)` (`internal/recoveryexec/executor.go:116`). Every piece
  of that wiring is exported, so a test in another package can construct the same executor:
  `recoveryexec.Executor{Store: ..., RunID: ..., Load: ...}` plus `Execute(ctx)`. The planner
  reaches the interval close through `recovery.StepCloseAdapterInterval`
  (`internal/recovery/planner.go:472`, used at planner.go:718, :732, :745), whose handler is
  `closeAdapterInterval` -> `closeOpenExecutionInterval` (`internal/recoveryexec/handlers.go:898-926`).

  `internal/status` does not import `internal/recoveryexec`, and `internal/recoveryexec` does not
  import `internal/status` (both verified with `go list -deps` on this tree), so the new test file
  may import `recoveryexec` with no cycle.

  IF THE FULL `Execute` WIRING DEFEATS YOU, SAY SO RATHER THAN FAKING IT. The honest fallback is
  to drive the same `closeOpenExecutionInterval` arithmetic through whatever exported recovery
  entry point does work, and to state PLAINLY in your report which layer you actually exercised
  and which you did not. What is NOT acceptable is hand-appending a pre-computed
  `execution.stopped{charged_duration: 9000000}` and calling it a real resume: that would assert
  the arithmetic you wrote into the fixture, not the arithmetic in `handlers.go`. If you end up
  hand-appending, name the criterion you weakened and say the clamp went unexercised.

  RED-FIRST HONESTY ABOUT CRITERION 4. The charge is ALREADY correct on unfixed main — clamping to
  9,000,000 is existing, working behaviour, and a test asserting only the journal would pass on
  main and prove nothing about this change. That is why the charge-preservation test must ALSO
  assert the disclosure in the same scenario: after the clamped close, `budget.open_execution` is
  null and `budget.consumed_budget_ms == 9000000`. It then reds on main for the right reason —
  the `budget` key does not exist — while still pinning that the charge is untouched. State this
  in your report in your own words; do not claim the charge assertion is what makes it red.

  SCORE PLACEMENT. This score temporarily replaces the committed reference-workflow score because
  `partitur run` reads only `<repo>/partitur.yaml` and takes no score operand (#435). It, and the
  cast commit that precedes it (#436), are reverted before the pull request; only the
  `internal/status/` change is meant to land.

