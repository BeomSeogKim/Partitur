    instruction: |
      Fix issue #316 in this repository, red-first. Everything you write is English.

      The design is already agreed and is in this score's context. Your job is to implement it
      exactly and to prove it, not to reopen it. If you believe the design is wrong, STOP and say
      so in your report instead of changing it.

      Step 0 — CONFIRM THE GROUND, cheaply.

      Report the output of each, verbatim:

        grep -n 'executeWithin(t, client, plan, 2\*time.Second)' internal/adapter/execute_test.go
        grep -n 'incidentalTestDeadline      = 10 \* time.Second' internal/adapter/client_test.go
        grep -rl 'go:build mutation' internal/adapter/ ; echo "rc=$?"

      You must see exactly three `2*time.Second` call sites, the 10s deadline constant, and no
      mutation-tagged file in `internal/adapter`. If any of that does not hold, STOP: the tree is
      not the one this score was written against.

      Step 1 — RED FIRST, in two layers. Both layers go in your report.

      Layer 1 (baseline). Before editing anything, run every acceptance command in this movement
      exactly as written below and record each exit status. The four artifact criteria
      (`liveness-bound-declared-once`, `three-sites-use-the-bound`, `liveness-guard-pinned`,
      `mutation-proof`) must be nonzero, because none of what they name exists yet. Say so
      plainly: this layer is an absence check, and on its own it is weak evidence.

      Layer 2 (the load-bearing red). This is the one that matters, and you must produce it BY
      HAND before you write the mutation test that automates it.

        - Introduce the constant with the WRONG value first:
          `const executeCancellationLivenessBound = incidentalTestDeadline`, wire the three call
          sites to it, and write the guard test (step 3). Run

              go test -count=1 -v -run '^TestExecuteCancellationLivenessBoundStaysInsideClientDeadline$' ./internal/adapter/

          It MUST fail, and the failure text must name the violated strict upper bound. Quote the
          failure verbatim.
        - In the same wrong-value tree, also run

              go test -count=1 -v -run '^TestExecuteCancellationDuringLaunchEndsTheCall$' ./internal/adapter/

          and report its exit status and duration. Expect it to PASS in milliseconds. State in
          one sentence what that means: at a bound equal to the client's own deadline that test
          becomes a tautology rather than a failure, which is why the guard test has to exist.
        - Repeat the first command with `const executeCancellationLivenessBound = 20 * time.Millisecond`
          and confirm the guard fails on the LOWER bound too, naming it. Quote it.
        - Then set the value to `6 * time.Second` and confirm the guard passes.

      Do not skip Layer 2 or reconstruct it from reasoning. If a command is blocked by your
      sandbox, say exactly which and how, and do not report a blocked command as evidence.

      Step 2 — the constant and the three call sites.

      In `internal/adapter/execute_test.go`, declare exactly once, with exactly this comment and
      value:

          // Must remain strictly greater than the injected 20ms cancellation grace
          // and strictly less than incidentalTestDeadline so the launch-watcher
          // oracle cannot be satisfied by the client's own deadline.
          const executeCancellationLivenessBound = 6 * time.Second

      Place it near the top of the file, above the first test that uses it. Replace the
      `2*time.Second` argument at all three `executeWithin` call sites (:575, :673, :889) with
      `executeCancellationLivenessBound`, so the file contains that call form exactly three times
      and no `executeWithin(..., 2*time.Second)` at all. Change nothing else about those three
      tests: not their assertions, not their fixtures, not their subtable entries.

      The existing comment at :671-672 explains the launch-site tautology. Keep it. You may
      rewrite it only to name the constant instead of "2s"; do not delete it and do not reflow the
      surrounding code.

      Other `2*time.Second` occurrences in the package (`client_test.go:763,781`,
      `execute_test.go:753`) are NOT `executeWithin` limits and are out of scope. Leave them.

      Step 3 — the guard test, in `internal/adapter/execute_test.go`.

          func TestExecuteCancellationLivenessBoundStaysInsideClientDeadline(t *testing.T) {

      It asserts, with STRICT inequalities and a failure message that names which side was
      violated:

          20*time.Millisecond < executeCancellationLivenessBound < incidentalTestDeadline

      Say in a comment what each side buys: the lower side is the injected cancellation grace
      every one of these clients is built with, so a bound at or below it fails before the
      mechanism under test can run; the upper side is the client's own deadline, and a bound at
      or above it lets `TestExecuteCancellationDuringLaunchEndsTheCall` pass for the wrong reason
      (`execute.go:58-75`). This is a pure arithmetic test: it starts no process, takes no
      wall-clock time, and must not.

      Step 4 — the mutation proof, in ONE new file `internal/adapter/mutation_test.go`.

      Follow `internal/launch/mutation_test.go` — read it first; it is the closest and smallest
      instance of the convention, and your file should look like it.

          //go:build mutation
          func TestMutationExecuteCancellationLivenessBoundMustStayBelowTheClientDeadline(t *testing.T) {

      It must:
        - copy the repository into `t.TempDir()` with a local copy helper that skips the `.git`
          and `.partitur` directories (#439/#443 — copying `.partitur` copies run state and is a
