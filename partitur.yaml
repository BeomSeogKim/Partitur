      explicit run id, so they never reach the scan at all. They were NOT the take-1 failure and
      they must stay green.

  THE MINIMAL API SHAPE THIS SCORE REQUIRES — AND DELIBERATELY DOES NOT DESIGN. Today's
  `statusprojection.Read(root, requestedID)` is shared by eight call sites: cmd/partitur/main.go:592
