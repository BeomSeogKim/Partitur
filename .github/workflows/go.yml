name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Go's per-package test timeout defaults to 10m, and under -race
      # `cmd/partitur` has exceeded it on macOS and come within 2% of it on
      # ubuntu, so the bound is stated rather than inherited: a timeout panic
      # reads as a hang, not as a suite that grew. Measured from this
      # workflow's own logs on 2026-09-01 — `cmd/partitur` is the binding
      # package on both runners, at 514-642s across 17 macOS runs
      # (2026-08-20..08-31) and 417-589s across 8 ubuntu runs (2026-08-31).
      # The ten daily macOS points show no detectable linear growth over those
      # twelve days (slope +1.2s/day, r^2=0.01) — a short series, not a
      # guarantee about what the catalogue does next. 20m is 1.9x the slowest
      # run observed.
      #
      # One bound covers every package, so the slowest one sets it. Both of
      # #334's timeouts fired in `internal/driver`, whose healthy -race cost
      # here is 161s: for the package that actually hangs, 20m is still loose
      # by 7.5x. What this buys is ten minutes, not precision.
      - name: Race
        run: go test -race -count=1 -timeout=20m ./...

      # Keep this in the OS matrix: beyond catalogue parity, the kill harness
      # probes the session-sweeping and fencing assumptions on each runner.
      - name: Fault-probe catalogue locks
        run: go test -tags=faultprobe -count=1 ./...

  # This job always runs for every pull request and push to main, and its
  # `mutation` status check is required to merge. That requirement lives in the
  # repository's branch protection, not here: workflow YAML cannot express merge
  # requirements, so this comment is the only place the file can record it.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Each mutation spawns a child `go test`, so this package's cost grows
      # with the catalogue: `cmd/partitur` measures 336s locally and timed out
      # against the inherited 10m default on the runner once the apply
      # conjuncts landed. The bound is explicit so the next addition fails on
      # its merits rather than on a clock.
      - name: Mutation proofs
        run: go test -tags=mutation -count=1 -timeout=40m ./...

  # `spikes` is a nested module, so the root job's `./...` never reaches it.
  # The suites are compatibility probes, not just a compile check: they assert
  # the platform behaviour the design rests on — session sweeping, fencing,
  # Git merge semantics. A failure here means an assumption stopped holding on
  # this runner, which is a different signal from a production regression.
  spikes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: spikes/go.mod
          # v5 keys the cache off the root go.sum by default; point it at the
          # nested module so invalidation stays aligned if the two diverge.
          cache-dependency-path: spikes/go.sum

      # The fanin spike measured a Git floor of 2.47; recorded so a failure
      # below it is legible as a host shortfall rather than a regression.
      - name: Git version
        run: git --version

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # `-count=1` because setup-go restores GOCACHE and Go caches successful
      # test results: a probe that replays a cached pass has not probed this
      # runner. `-v` so the harness's measurements reach the job log.
      - name: Test
        run: go test -count=1 -v ./...
